name: Response time

on:
  pull_request:
    branches: [v1-test]
  push:
    branches: [v1-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: response-time-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  response-time:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      META_RESEARCH_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.11.3
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium and system dependencies
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Check frontend logic and latency gate calculations
        working-directory: web
        run: npm test

      - name: Build and check response times
        working-directory: web
        run: npm run test:response-time

      - name: Upload response-time evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: response-time-results
          path: web/response-time-results/
          if-no-files-found: warn
          retention-days: 14
