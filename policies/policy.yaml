# policies/policy.yaml —— 全部可调旋钮（P2 机制与策略分离；版本入 Git）
# 注册表唯一权威 = 《第一部分》附录 C：每旋钮带默认值，用户只改想改的；标 [M6 调] 的项在 M6 实测后复核默认。
# 机制代码零硬编码：影响研究语义 / 门禁 / 预算 / 选择的数值只在本文件（纯工程常量如 busy_timeout 不在此列，§1.1.4）。
# observation 节（parser 阈值：nan / divergence / loss_trend）为既有缺口，随 M4 真 parser 落地补全（OPEN #5）。

# —— 采集四元打分 ——
# w1=期望增益(gain) w2=信息量(info) w3=成本惩罚(cost) 权重，c=UCB 探索系数；公式见《第二部分》§6.4 R3 [M6 调]
acquisition: { w1: 0.35, w2: 0.25, w3: 0.30, c: 0.10 }

# —— 预算 ——
# 单位与 ledger 一致（USD 等效）；初值≈廉价探针
budget: { B0: 5, doubling_period_m: 8, B_max: 40, session_max: 100000, price_per_1k_tokens: 0.3 }   # session_max=全局成本(ledger.money 求和)安全网上限（§4.4.6 判据②，M6；null 关闭）；100000 为失控兜底、远高于合法长跑（B_max=40×数百轮），A/B 实测后细化。price_per_1k_tokens=步⑩ tokens→money 汇率（ledger.money=tokens/1000×本值），notional/USD-等效、provisional（缺省使 cycle≈B_max 量级、session_max 为失控兜底）；session_max 启用时本值必须有限且>0，只有 session_max=null 关闭预算网时才允许 0。A/B 实测后细化。ledger 写入=M6 硬化（步⑩ CP10.2 接线）

# —— 流程阈值 ——
flow:
  decompose_threshold: 1.0            # est_cost > 1.0×B(t) ⇒ 走 decompose（软约束，执行点=reasoning R3 提示词；§4.4.4）
  tau: { score_floor: 0.25, consecutive_rounds: 3 }   # 终止判据①：open 最高分连续 3 轮 < 0.25
  audit_cadence_K: 5                  # 每 5 轮推送摘要
  retry:
    artifact_parse: 2                 # 产物解析重试 ≤2（三级校验统一口径）
    plan_review: 2                    # plan 可回答性评审 ≤2（§3.1.3 审计契约）
    bundle_code_review: 3             # bundle 代码适配评审 ≤3（§3.4.3 / §4.1.4 附注）
    bundle_result_review: 3           # bundle 结果评审 ≤3
  watchdog: { probe_h: 2, full_h: 24 }   # 单次执行时限唯一定义点（资源硬件在 resources）

# —— 检索 / import ——
retrieval:
  recipe: default_v1                  # 检索配方（provider 组合与排序）
  budget_by_question_scale: { small: 2, medium: 5, large: 10 }   # 每轮高层检索的候选解析上限档位（闸3）
  scale_thresholds:                    # est_cost/B(t) 或 score 任一达线即进对应档；large 先判
    medium: { est_cost_ratio: 0.25, score: 0.40 }
    large: { est_cost_ratio: 0.75, score: 0.75 }
  # 闸2：lifetime visit 与 current-goal append-only inconclusive streak 独立命中才触发
  gate2_stuck_threshold: { visit_count: 3, consecutive_inconclusive: 2 }

# import 发现是受信 host connector，不是模型工具。query 由 plan sidecar 提交；候选数由
# retrieval 的 small/medium/large 档与本节硬上限共同决定。GitHub token 只从环境变量读，不入 policy/回执。
# auto_license 是运维方钉死的机械策略，不是模型法律判断；不在 allow_spdx 的候选只记 review。
import_search:
  provider: github_rest_v1
  max_candidates: 10
  timeout_s: 20
  max_response_bytes: 2097152
  auto_license:
    allow_spdx: [Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC]
    scope: { allow_eval: true, allow_modify: true, allow_publish_pool: true, allow_redistribute: false }

# selected_for_materialization 的默认 production fetcher。只接受 GitHub 40-hex commit，经 Git tree API
# 取得对象闭包并用 commit tar archive 的逐文件 Git blob SHA 交叉核；archive 外层压缩字节不作复现身份。
# LFS 只走 GitHub 固定 Batch endpoint + basic transfer；signed action URL/header 不落盘，下载后 OID/size 双核。
import_materialization:
  provider: github_archive_v1
  adapter_path: .meta-research/import-adapter.json
  timeout_s: 60
  max_api_response_bytes: 8388608
  max_archive_bytes: 8589934592
  max_file_bytes: 8589934592
  max_total_bytes: 68719476736
  max_files: 100000
  max_tree_depth: 64
  max_tree_objects: 10000
  max_submodules: 64
  lfs_policy: fetch
  max_lfs_objects: 10000
  lfs_batch_size: 100
  allowed_archive_hosts: [codeload.github.com]
  allowed_lfs_hosts: [github.com, github-cloud.s3.amazonaws.com, github-cloud.githubusercontent.com, objects.githubusercontent.com, objects-origin.githubusercontent.com, media.githubusercontent.com]
  dependency_lock_names: [python-wheel-lock.json, requirements.lock, requirements.txt, poetry.lock, uv.lock, conda-lock.yml, package-lock.json, pnpm-lock.yaml, yarn.lock, Cargo.lock]
  adapter_generation:
    provider: codex-reviewed-sidecar-v1
    prompt_version: 1
    max_inventory_paths: 1024
    max_inventory_bytes: 131072
    max_preview_files: 32
    max_preview_file_bytes: 32768
    max_preview_total_bytes: 262144
    max_projection_bytes: 524288
  dependency_image:
    provider: python-wheel-image-v1
    lock_basename: python-wheel-lock.json
    allowed_hosts: [files.pythonhosted.org]
    timeout_s: 60
    max_lock_bytes: 16777216
    max_wheels: 1024
    max_wheel_bytes: 17179869184
    max_total_wheel_bytes: 34359738368
    max_unpacked_wheel_bytes: 68719476736
    max_wheel_entries: 1000000
    max_installed_bytes: 34359738368
    max_installed_files: 100000
    install_timeout_s: 3600
    build_timeout_s: 7200
    load_timeout_s: 7200
    max_image_archive_bytes: 68719476736
    max_cached_images: 64
    site_packages_path: /opt/meta-research/site-packages
  compiler:
    implementation: CPython
    version: 3.11.15
    artifact_sha256: sha256:272179ddd9a2e41a0fc8e42e33dfbdca0b3711aa5abf372d3f2d51543d09b625

# 非默认三闸：stuck/sota 只派生独立参照问题；human_named 只消费已确认 directive authority。
# SOTA 来源正文由受信 host 以私有内容寻址 blob 冻结；严格 host allowlist 防任意 URL/SSRF。
import_reference:
  max_child_questions_per_survey: 1
  reference_snapshot:
    provider: bounded_https_v1
    allowed_hosts: [arxiv.org, export.arxiv.org, openreview.net, paperswithcode.com, proceedings.neurips.cc, openaccess.thecvf.com]
    timeout_s: 20
    max_response_bytes: 4194304

# —— 会话 ——
session: { dual_mode: A }             # A=一 turn 一阶段 [M6 实测后定默认]

# —— 树规模护栏 ——
tree_guard: { max_decompose_depth: 4, max_children_per_node: 6, max_open_questions: 30 }

# —— 问题重访 / 回看护栏 ——
question_guard: { max_inconclusive_per_question: 3 }   # 到限后对 attack 不可选，仅可作 decompose/propose_prune 对象（执行点 §4.2.1）
answer_review: { max_reviews_per_cycle: 5, spawn_counts_toward_max_open: true }   # 每轮回看判定上限（执行点 §4.2.4 apply_tree_ops）

# —— goal_amend 护栏 ——
goal_amend: { max_closed_revalidate_per_cycle: 10, max_spawn_from_goal_amend: 5 }

# —— 卡片 / 召回 ——
cards: { subtree_card_depth: 1, tag_policy: free_v1 }   # subtree 默认深度 1、宽度全部

# —— idea / wildidea ——
idea:
  sd_threshold: 6                     # Structural Depth 淘汰阈值（SD<6 淘汰，§3.1.3）
  candidate_top_k: 3                  # 自评筛选前 3
  dedup_budget: 10                    # 查重预算 = 每候选联网查重调用上限
  forbid_proto_term_source: question_task_terms   # 禁词取自本问题任务词
  cross_phase: { decompose_assist: true, spawn_assist: true, budget: 5 }   # 跨阶段调用开关与预算（§3.2.5）；附录 C 原文写 on，YAML1.1 下 on ≡ true，此处取 true 防解析歧义

# —— interaction（§4.6 / 二部 §6.12 ④）——
interaction:
  classify_conservativeness: high     # 保守三分类：可能改状态一律 directive/回显
  ack_sla_s: 2                        # M5 验收 p95 目标
  query_sla_s: 2
  responder_fallback: { grounding_fail_to_template: 1 }   # grounding 不过 1 次即退模板渲染
  mediator_rebuild_last_n: 20         # 中介重建对话条数（§4.6.2）
  notify_matrix: all_qq_on            # 事件→通道开关表（§4.6.6）；默认全事件走 qq，细表运行期调

# —— execution（步⑧ CP8.1：execution_manifest 命令围栏——manifest 命令的超时与路径边界唯一定义点）——
execution:
  default_timeout_s: 600              # manifest 命令未声明 timeout_s 时的默认
  max_timeout_s: 86400                # 声明值上限截断（真训练需长时；与 flow.watchdog.full_h=24h 对齐）
  path_allowlist: []                  # argv 允许出现的 work_root 以外绝对路径前缀（如真数据根）；默认空 = 只许 work_root 内
  sandbox:                            # adversarial bundle/import 唯一生产执行后端；镜像须已在本地，绝不隐式 pull
    backend: docker
    engine_path: /usr/bin/docker
    engine_host: unix:///var/run/docker.sock
    resource_mode: rlimit-fallback    # 必须与 daemon preflight 实测一致；换 cgroup 节点须显式改 policy/env_hash
    seccomp_profile: policies/seccomp/moby-default-v0.2.1.json
    seccomp_sha256: sha256:ea7ba4298390d31a9d52354cf4319e4fe6cbd717ff6b47f23a496ca169727c76
    seccomp_bpf: policies/seccomp/moby-default-v0.2.1-linux-5.4-amd64.bpf.b64
    seccomp_bpf_sha256: sha256:4fb43ea7bb76d9462eb73270fb52e473fb4423bfe09040bfa16c255a7eb133f2
    seccomp_bpf_arch: amd64
    image: docker.io/library/python@sha256:f5cf0344c9886ff24d34797578d5d7dd6e8911ae0fe5962bb55d0f89603ec361
    image_id: sha256:eeeca161459e242a142661623fed2320f84e810603a42ffc4a5cdbc8694b3bb3
    python_path: /usr/local/bin/python3
    memory_mb: 16384                  # cgroup 可用时为 aggregate；否则 launcher 的每进程 RLIMIT_AS（receipt 明示 fallback）
    pids: 64                          # cgroup pids.max + 非 root payload RLIMIT_NPROC 双层请求
    nofile: 1024
    max_log_mb: 64                    # Docker json-file 两段总上限；一旦轮转即将该执行判失败，防截断证据被接纳
    max_file_mb: 8192                 # RLIMIT_FSIZE（单文件）
    max_output_mb: 32768              # quarantine 后验总量；部署仍须给 work-root/VEPFS 做硬 quota
    max_output_files: 100000
    cpus: 4
    tmpfs_mb: 1024
    shm_mb: 64                         # 显式固定易失 /dev/shm；按项目数据加载需求随 env_hash 调整
    input_max_mb: 65536               # fd/tree 可信快照总量；更大数据须走下方显式只读 mount
    readonly_mounts: []               # 与 path_allowlist 配对的部署数据根；只读 bind，不暴露 work-root
    payload_environment: {}            # 可信镜像 capability 可派生 PYTHONPATH；任务 env 不得覆盖

# —— resources（启动输入③：只放硬件事实，§4.6.7；时限唯一归 flow.watchdog）——
resources: { gpus: 4, gpu_mem_gb: 80, disk_quota_gb: 500 }

# —— deployment（运行信任事实；development 永不产生 production-ready 语义）——
# production 必须把 attestation_path 指向部署者持有、service account 不可写的 canonical JSON；
# 进程实时核 service/隔离/Docker/mount；GPFS quota 数值取部署 root 在 300 秒内签发的权威 snapshot。
# 代码只验合同，不负责创建 VM/quota，也不把 df/statvfs 冒充 hard quota。
deployment: { mode: development, attestation_path: null, max_attestation_age_s: 300 }

# —— interaction_request（文件请求，§4.6.8；执行点 = interaction_request_create 创建拒绝判据）——
# 无自动超时放弃：全局等待 + 周期提醒，用户可 cancel
interaction_request: { enabled: true, max_items_per_request: 10, max_requests_per_goal: 5, remind_interval_h: 24 }

# —— observation（§4.7/§4.3.1 parser 阈值；OPEN #5 落地，M4 CP5.3）——
# extraction_policy_hash = 本节规范化 JSON 的 sha256（obs_parser.extraction_policy_hash）：
# 同 log + 同 parser_version + 同本节 → 同 observation / 同 parser_result_suspect（P6 可回放）。
# 改本节任一值 = 决策性变更（走评审）；旧观测行带旧 hash——复算须按行内 extraction_policy_hash 取当时口径。
observation:
  parse:                              # raw log → 机器事实字段的确定性规则（obs_parser.parse_log）
    divergence_ratio: 2.0             # last_loss > first_loss × ratio → divergence_flag=1（**仅对正 loss 序列**；首 loss ≤0 不判——负 loss 域判据留扩展）
    trend_window: 3                   # loss_trend 取最后 N 个 loss 判势
    flat_epsilon: 0.001               # 窗口内 |首尾差| ≤ ε → flat
  suspect:                            # parser_result_suspect 置位判据（任一命中 → 1；仅负向过滤：挡复用/挡关问，不支持结论）
    nan_seen: true                    # nan_seen=1 即存疑
    divergence_flag: true             # divergence_flag=1 即存疑
    loss_trend_suspect: [nan]         # loss_trend ∈ 此集即存疑
    max_oom_count: 0                  # oom_count > 此值即存疑
    max_retry_count: 2                # retry_count > 此值即存疑
