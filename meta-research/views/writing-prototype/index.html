<!doctype html>
<html lang="zh-CN" data-prototype-route="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>Writing 校样与批注道 · Throwaway Prototype</title>
  <!-- Three structural UI variants for issue 76, switchable via ?variant=A|B|C. -->
  <style>
    :root{
      --paper:#f1f2ef;--ink:#202633;--graphite:#5d6671;--rule:#d3d7d2;
      --annotation:#a2262c;--wax:#59232b;--sheet:#fbfbf8;--wash:#e7e9e5;
      --muted:var(--graphite);--lab:var(--paper);--glass:var(--sheet);--line:var(--rule);
      --cobalt:var(--annotation);--signal:var(--annotation);--shadow:0 12px 28px rgba(32,38,51,.08);
      --display:"Arial Narrow","Roboto Condensed","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
      --body:"Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
      --manuscript:"Noto Serif CJK SC","Songti SC","Source Han Serif SC",Georgia,serif;
      --annotation-font:"Kaiti SC","STKaiti","KaiTi",serif;
      --utility:"IBM Plex Mono","Noto Sans Mono CJK SC",ui-monospace,SFMono-Regular,Consolas,monospace
    }
    *{box-sizing:border-box}
    html{background:var(--paper);color:var(--ink);font-family:var(--body);scrollbar-gutter:stable}
    body{margin:0;min-width:320px;overflow-x:hidden;padding-bottom:68px;background:var(--paper)}
    button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}
    button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--annotation);outline-offset:3px}
    h1,h2,h3,p{margin-top:0}h1{font-family:var(--display);font-size:clamp(31px,3.8vw,54px);font-weight:780;letter-spacing:-.045em;line-height:.98}h2{font-family:var(--display);font-size:19px;line-height:1.2}h3{font-size:13px}.muted{color:var(--graphite)}.grow{flex:1}.mono{font-family:var(--utility);font-size:10.5px;letter-spacing:-.02em}

    /* shared editorial docket */
    .proto{min-height:32px;padding:6px 22px;background:var(--ink);color:var(--paper);display:flex;gap:20px;align-items:center;font-family:var(--utility);font-size:8px;letter-spacing:.13em}.proto span{opacity:.62}.proto>b{color:#fff;font-weight:700}
    .shell{max-width:1840px;margin:auto;padding:20px 24px 32px}.topbar{display:grid;grid-template-columns:auto minmax(320px,1fr) auto auto;align-items:end;gap:clamp(16px,3vw,44px);margin-bottom:14px;padding-top:8px;border-top:5px solid var(--ink)}
    .brand{display:flex;align-items:center;gap:11px;min-width:max-content}.brand-mark{position:relative;width:46px;height:40px;border:1px solid var(--ink);background:var(--sheet);color:var(--ink);display:grid;place-items:center;font-family:var(--utility);font-size:10px;font-weight:800;letter-spacing:.05em}.brand-mark::before,.brand-mark::after{content:"";position:absolute;background:var(--annotation)}.brand-mark::before{width:14px;height:1px;right:-7px;top:50%}.brand-mark::after{height:14px;width:1px;right:-1px;top:calc(50% - 7px)}.brand strong{display:block;font-family:var(--display);font-size:15px;letter-spacing:.01em}.brand small{display:block;margin-top:3px;color:var(--graphite);font-family:var(--utility);font-size:8px;letter-spacing:.07em;text-transform:uppercase}
    .thesis{position:relative;display:flex;align-items:baseline;gap:.22em;min-width:0;padding:7px 0 11px;border-bottom:1px solid var(--ink);font-family:var(--display);font-size:clamp(24px,3vw,45px);font-weight:760;letter-spacing:-.04em;line-height:.95;white-space:nowrap}.thesis em{color:var(--annotation);font-style:normal}.thesis small{margin-left:auto;color:var(--graphite);font-family:var(--utility);font-size:7px;font-weight:500;letter-spacing:.06em;line-height:1.5;text-align:right;white-space:normal}.thesis::after{content:"校样线  /  PROOF";position:absolute;left:0;bottom:-15px;color:var(--annotation);font-family:var(--utility);font-size:6px;letter-spacing:.13em;background:var(--paper);padding-right:8px}
    .version-seal{position:relative;min-width:108px;padding:8px 10px 7px;border:1px solid var(--wax);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--wax);background:var(--wax);color:#fff;text-align:center;transform:rotate(-1deg)}.version-seal b,.version-seal small{display:block}.version-seal b{font-family:var(--utility);font-size:11px;letter-spacing:.08em}.version-seal small{margin-top:3px;font-family:var(--utility);font-size:7px;line-height:1.4;opacity:.78}
    .mode-tabs,.seg{display:flex;gap:0;border:1px solid var(--rule);background:var(--sheet)}.mode-tabs::before{content:"载体";align-self:center;padding:0 9px;color:var(--graphite);font-family:var(--utility);font-size:8px;letter-spacing:.08em}.mode-tabs button,.seg button,.soft-btn{border:0;border-left:1px solid var(--rule);background:transparent;padding:9px 12px;font-size:12px;font-weight:700}.mode-tabs button[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--ink);color:#fff}.mode-tabs button:hover,.seg button:hover{box-shadow:inset 0 -3px 0 var(--annotation)}
    .meta-strip{display:grid;grid-template-columns:auto auto 1px minmax(190px,auto) auto auto minmax(24px,1fr) auto;gap:10px;align-items:center;padding:9px 12px;margin-bottom:14px;background:var(--wash);border-block:1px solid var(--rule);border-left:3px solid var(--ink)}.meta-strip b{font-family:var(--utility);font-size:13px}.meta-strip .candidate{justify-self:end}.candidate-short{display:none}.sep{width:1px;height:21px;background:#b8bdb8}
    .chip{display:inline-flex;gap:6px;align-items:center;padding:5px 7px;border:1px solid var(--rule);border-radius:0;background:var(--sheet);font-family:var(--utility);font-size:9px;font-weight:700;line-height:1.15}.chip::before{content:"·";font-size:14px;line-height:0;color:var(--graphite)}.chip.stale{color:#7a441b;background:#f6eee4;border-color:#c8a47c}.chip.stale::before{content:"△";color:#9b571f}.chip.incomplete{color:var(--wax);background:#f3e7e8;border-color:#c08b8e}.chip.incomplete::before{content:"!";color:var(--annotation)}.chip.ok{color:#315a49;background:#e8efea;border-color:#90aa9e}.chip.ok::before{content:"✓";color:#315a49}.chip.candidate{color:#424956;background:#eceeea;border-color:#aeb4ae}.chip.candidate::before{content:"?";color:var(--annotation)}
    .panel{background:var(--sheet);border:1px solid var(--rule);border-radius:0;box-shadow:0 2px 0 rgba(32,38,51,.06)}.pad{padding:16px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-family:var(--utility);font-size:8px;color:var(--graphite);font-weight:800}

    /* shared controls, references and proof marks */
    .outline button,.list-btn,.source-card,.node,.step,.doc-block,.slide,.version{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:0;padding:10px}.outline button:hover,.list-btn:hover,.source-card:hover,.node:hover,.doc-block:hover,.slide:hover,.version:hover{background:#f0f0ec;border-color:var(--rule)}.outline button[aria-pressed=true],.list-btn[aria-pressed=true],.source-card[aria-pressed=true],.doc-block[aria-pressed=true],.slide[aria-pressed=true],.version[aria-pressed=true]{background:#f4e9e8;border-color:#bd8588;box-shadow:inset 3px 0 0 var(--annotation)}.outline small,.source-card small,.version small{display:block;color:var(--graphite);margin-top:4px;line-height:1.45}
    .source-card{position:relative;display:block;color:inherit;text-decoration:none;border-color:var(--rule);background:var(--sheet);margin:9px 0;padding:15px 12px 12px 23px}.source-card::before{content:"";position:absolute;left:10px;top:13px;bottom:13px;width:1px;background:var(--annotation)}.source-card::after{content:"精确引证";position:absolute;right:8px;top:6px;color:var(--annotation);font-family:var(--annotation-font);font-size:9px}.source-coordinate{display:block;margin-bottom:6px;color:var(--annotation);font-family:var(--utility);font-size:7px;letter-spacing:.07em}.source-card .support{padding-top:8px;margin-top:8px;border-top:1px dashed #b7bbb6;line-height:1.55}.source-card .not-support{color:var(--annotation);font-family:var(--annotation-font);font-size:12px}.source-title{display:block;padding-right:50px;font-family:var(--display);font-weight:760;font-size:12.5px;line-height:1.3}
    .trace-readout{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0 0 16px;padding:10px 0;border-block:1px solid var(--rule);background:transparent}.trace-readout span{grid-row:1/3;align-self:center;padding:7px;border:1px solid var(--annotation);color:var(--annotation);font-family:var(--utility);font-size:10px;font-weight:800}.trace-readout b{font-family:var(--display);font-size:12px}.trace-readout small{color:var(--graphite);font-family:var(--utility);font-size:7px}.rule{height:1px;background:var(--rule);margin:14px 0}
    .primary,.secondary{border-radius:0;padding:10px 13px;font-size:12px;font-weight:760}.primary{border:1px solid var(--ink);background:var(--ink);color:#fff}.primary:hover{background:var(--wax);border-color:var(--wax)}.secondary{border:1px solid #aeb3ae;background:var(--sheet)}.secondary:hover{border-color:var(--annotation);color:var(--annotation)}.danger-lite{color:var(--annotation);background:#f6ebea;border-color:#bd8588}.button-row{display:flex;gap:8px;flex-wrap:wrap}
    .notice{padding:11px 12px;border:1px solid #c79b7b;border-left:4px solid #9b571f;border-radius:0;background:#f6eee4;font-size:11.5px;line-height:1.55}.safe{background:#e8efea;border-color:#90aa9e;border-left-color:#315a49}.axis{display:grid;grid-template-columns:104px 1fr;gap:8px;font-size:11px;margin:8px 0}.axis dt{color:var(--graphite);font-family:var(--utility);font-size:9px}.axis dd{margin:0;font-weight:650}.locked{position:relative;padding:12px 12px 12px 17px;border:1px dashed #8f9690;border-left:4px solid var(--annotation);background:#f4efeb;font-family:var(--utility);font-size:10px;line-height:1.65}.locked::after{content:"锁定批条";position:absolute;right:8px;top:6px;color:var(--annotation);font-family:var(--annotation-font);font-size:10px}.revision-box textarea{width:100%;min-height:92px;border:1px solid #aeb3ae;border-radius:0;padding:11px;background:#fff;resize:vertical}.revision-box textarea:focus{border-color:var(--annotation)}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare>div{padding:15px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);background:#f7f7f3}.del{background:#f0d9d8;text-decoration:line-through;text-decoration-color:var(--annotation)}.add{background:#e1e8e2;box-shadow:inset 0 -2px 0 #52705f}

    /* A: proof sheet with marginalia */
    .a-grid{display:grid;grid-template-columns:220px minmax(440px,1fr) 350px;gap:12px;position:relative}.sidebar{min-height:700px;background:var(--wash);box-shadow:none}.sidebar-head{padding:4px 4px 13px;border-bottom:1px solid #aeb3ae}.sidebar-head h2{margin-bottom:0}.outline-group{margin:17px 0 6px;padding:0 10px;color:var(--graphite);font-family:var(--utility);font-size:8px;font-weight:800;letter-spacing:.09em}.outline button{position:relative;padding:12px 10px 12px 14px}.outline button b{font-family:var(--display);font-size:13px}.outline button[aria-pressed=true]::after{content:"批注 →";position:absolute;right:8px;top:8px;color:var(--annotation);font-family:var(--annotation-font);font-size:11px}
    .paper{min-height:750px;padding:clamp(30px,4vw,64px);background:#fff;position:relative;overflow:visible;box-shadow:0 8px 24px rgba(32,38,51,.07)}.paper::before{content:"MANUSCRIPT  /  FROZEN INPUT r184";position:absolute;left:13px;top:18px;color:var(--graphite);font-family:var(--utility);font-size:7px;letter-spacing:.08em;writing-mode:vertical-rl}.paper::after{content:"";position:absolute;left:31px;top:0;bottom:0;width:1px;background:#dddeda}.paper-head{max-width:760px;margin:0 auto 28px;padding-bottom:23px;border-bottom:1px solid var(--ink)}.paper-head::before{content:"校样 / 03";display:block;margin-bottom:16px;color:var(--annotation);font-family:var(--annotation-font);font-size:13px}.paper-head p{max-width:650px;margin-bottom:0;color:#474e58;font-family:var(--manuscript);line-height:1.8}.doc{max-width:760px;margin:auto}.doc-block{position:relative;padding:18px 21px 18px 20px;margin:4px -18px}.doc-block .label{font-family:var(--utility);font-size:8px;letter-spacing:.11em;color:var(--annotation);font-weight:800}.doc-block .coord{position:absolute;right:12px;top:12px;color:var(--graphite);font-family:var(--utility);font-size:8px}.doc-block h2{font-family:var(--manuscript);font-size:21px;margin:8px 0}.doc-block p{font-family:var(--manuscript);font-size:15px;line-height:1.9;margin-bottom:0}.doc-block[aria-pressed=true]{background:#fbf2ee;box-shadow:inset 3px 0 0 var(--annotation)}.doc-block[aria-pressed=true]::after{content:"";position:absolute;z-index:4;right:-38px;top:50%;width:38px;border-top:1px solid var(--annotation)}.doc-block[aria-pressed=true] .coord{color:#fff;background:var(--annotation);padding:3px 5px}.citation{color:var(--annotation);font-family:var(--utility);font-size:9px;font-weight:800;white-space:nowrap}
    .storyboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.slide{position:relative;aspect-ratio:16/9;border-color:#aeb3ae;background:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:16px;box-shadow:4px 4px 0 var(--wash)}.slide::after{content:"";position:absolute;left:0;right:0;top:30px;border-top:1px solid var(--rule)}.slide b{font-family:var(--display);font-size:20px;line-height:1.08}.slide small{color:var(--graphite);font-family:var(--utility);font-size:8px}
    .inspector{min-height:700px;position:relative;border-top:0;border-left:3px solid var(--annotation);box-shadow:none;background:#f7f4ef}.inspector::before{content:"页边批注 / MARGINALIA";display:block;margin:-2px 0 12px;color:var(--annotation);font-family:var(--annotation-font);font-size:12px}.inspector nav{display:flex;gap:0;border-block:1px solid var(--rule);margin:0 0 16px}.inspector nav button{flex:1;border:0;border-right:1px solid var(--rule);background:transparent;padding:10px 5px;font-family:var(--utility);font-size:9px;font-weight:750}.inspector nav button[aria-pressed=true]{background:var(--wax);color:#fff}.inspector nav button:last-child{border-right:0}

    /* B: three bound volumes from one semantic spine */
    .b-wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px}.fact-rail{min-height:690px;background:var(--ink);color:var(--paper);border:0;border-left:4px solid var(--annotation);box-shadow:none}.fact-rail .eyebrow,.fact-rail .muted{color:#b8beb8}.fact-rail .readonly{color:#e2e4df;background:transparent;border-color:#606875}.fact-rail .source-card{color:var(--paper);background:#2a313e;border-color:#4b5360;font-size:12px}.fact-rail .source-card small{color:#bfc4be}.fact-rail button.source-card::after{content:"研究只读";color:#e7a6a8}.fact-rail .rule{background:#555d68}.fact-rail .secondary{background:transparent;color:#fff;border-color:#747c86}.readonly{padding:9px 10px;border:1px solid #c8ccc7;border-left:3px solid #8b928d;background:#f3f3ef;font-size:10.5px;color:#4e5660;line-height:1.45}
    .map{min-height:690px;padding:25px;overflow:hidden;position:relative;background:var(--paper)}.map::before{content:"装订对照 / BOUND VOLUMES";position:absolute;right:13px;top:10px;color:#8c928d;font-family:var(--utility);font-size:8px;letter-spacing:.14em}.map-title{display:flex;align-items:start;gap:14px;padding-bottom:15px;border-bottom:1px solid var(--ink)}.map-title h1{font-size:clamp(27px,3vw,42px);margin-bottom:0}
    .semantic-spine{display:grid;grid-template-columns:repeat(5,minmax(132px,1fr));gap:10px;margin:34px 0 29px;position:relative}.semantic-spine::before{content:"";position:absolute;left:3%;right:3%;top:50%;border-top:2px solid var(--annotation)}.node{position:relative;background:var(--sheet);border-color:#b8bdb8;min-height:106px;z-index:1}.node b{display:block;margin-bottom:6px;font-family:var(--display)}.node small{font-family:var(--utility);font-size:8px}.node-coordinate{display:block;margin-bottom:7px;color:var(--annotation);font-family:var(--utility);font-size:7px;letter-spacing:.08em}.node[aria-pressed=true]{background:#f4e9e8}.node[aria-pressed=true]::after{content:"共享语义";position:absolute;right:6px;bottom:5px;color:var(--annotation);font-family:var(--annotation-font);font-size:9px}
    .branches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.branch{position:relative;min-height:250px;border:1px solid #aeb3ae;padding:16px 14px 16px 23px;background:#faf9f4;box-shadow:6px 7px 0 #d9dbd6}.branch::before{content:"";position:absolute;left:7px;top:0;bottom:0;border-left:2px solid var(--wax)}.branch:nth-child(2){background:#f0f1ed;box-shadow:6px 7px 0 #cdd0ca}.branch:nth-child(3){background:#e9e9e5;box-shadow:6px 7px 0 #c4c7c1}.branch-head{display:flex;align-items:center;gap:9px;margin-bottom:11px;border-bottom:1px solid #aeb3ae;padding-bottom:9px}.branch-head b{font-family:var(--display);font-size:19px}.branch-head .brand-mark{width:32px;height:27px;font-size:9px;background:transparent}.version{border-color:#b7bbb6;background:rgba(255,255,255,.58);margin:7px 0}.lineage{display:flex;align-items:center;gap:6px;overflow:auto;padding:12px 0}.dot{min-width:8px;height:8px;border:1px solid var(--annotation);background:var(--sheet);border-radius:50%}.connector{min-width:24px;height:1px;background:var(--annotation)}.map-detail{margin-top:17px;display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.map-detail section{border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding:17px;background:var(--sheet)}.fact-rail .source-card{font-size:12px}

    /* C: vertical editorial sign-off docket */
    .c-wrap{max-width:1050px;margin:auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:start}.receipt{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:0;border-block:1px solid var(--ink);border-left:4px solid var(--wax);background:var(--sheet)}.receipt>div{padding:11px 13px;border-right:1px solid var(--rule)}.receipt>div:last-child{border-right:0}.receipt small{display:block;color:var(--graphite);font-family:var(--utility);font-size:8px;margin-bottom:4px}
    .stepper{display:flex;flex-direction:column;gap:0;margin:0;border-left:1px solid var(--ink)}.step{position:relative;padding:15px 12px 15px 28px;text-align:left;font-family:var(--utility);font-size:9px;color:var(--graphite);border:0;border-bottom:1px solid var(--rule)}.step::before{content:"";position:absolute;left:-5px;top:50%;width:8px;height:8px;border:1px solid var(--ink);border-radius:50%;background:var(--paper);transform:translateY(-50%)}.step[aria-pressed=true]{background:var(--wax);color:#fff}.step[aria-pressed=true]::before{background:var(--annotation);border-color:#fff}.step[aria-pressed=true]::after{content:"当前签核";position:absolute;right:8px;bottom:5px;color:#e8c4c5;font-family:var(--annotation-font);font-size:9px}
    .focus-card{min-height:550px;padding:clamp(25px,4vw,50px);border:1px solid #b8bdb8;border-top:5px solid var(--ink);box-shadow:7px 8px 0 var(--wash);position:relative}.focus-card::after{content:"EDITORIAL SIGN-OFF";position:absolute;right:13px;top:11px;color:#8d938e;font-family:var(--utility);font-size:7px;letter-spacing:.12em}.focus-head{display:flex;gap:17px;align-items:start;margin-bottom:25px;padding-bottom:18px;border-bottom:1px solid var(--rule)}.focus-num{width:46px;height:46px;border:1px solid var(--annotation);background:transparent;color:var(--annotation);display:grid;place-items:center;font-family:var(--utility);font-size:17px;font-weight:800;flex:0 0 auto}.focus-head h1{font-size:34px;margin-bottom:7px}
    .choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{border:1px solid #b4b9b4;border-radius:0;background:var(--sheet);padding:18px;text-align:left;min-height:145px}.choice[aria-pressed=true]{border-color:var(--annotation);background:#f4e9e8;box-shadow:inset 0 -4px 0 var(--annotation)}.choice b{font-family:var(--display);font-size:21px;display:block;margin-bottom:8px}.review-item{display:grid;grid-template-columns:34px 1fr auto;align-items:start;gap:10px;padding:14px 0;border-bottom:1px solid var(--rule)}.review-item .count{width:29px;height:29px;border:1px solid #9ea49e;display:grid;place-items:center;font-family:var(--utility);font-size:10px;font-weight:800}.flow-actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.boundary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.boundary{border:1px solid #b4b9b4;border-radius:0;padding:20px;text-align:left;background:var(--sheet)}.boundary[aria-pressed=true]{border-color:var(--annotation);background:#f4e9e8;box-shadow:inset 4px 0 0 var(--annotation)}

    /* prototype chrome */
    .switcher{position:fixed;z-index:80;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:0;margin:0;border:1px solid #515966;border-top:3px solid var(--annotation);background:var(--ink);color:#fff;box-shadow:0 8px 24px rgba(32,38,51,.2);letter-spacing:0}.switcher button{width:34px;height:30px;border:0;background:#303744;color:#fff}.switcher button:hover{background:var(--annotation)}.switcher div{min-width:190px;padding:0 10px;text-align:center;font-family:var(--utility);font-size:8px}.switcher b{font-size:10px;color:#fff}.state{position:relative;width:min(380px,calc(100vw - 36px));margin:14px 18px 22px auto;background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--ink);font-family:var(--utility);font-size:9px}.state summary{padding:10px 12px;font-weight:800;cursor:pointer;letter-spacing:.05em}.state pre{margin:0;padding:0 12px 12px;max-height:210px;overflow:auto;white-space:pre-wrap}.toast{position:fixed;z-index:90;top:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-left:4px solid var(--annotation);box-shadow:var(--shadow);font-size:11px}

    @media(max-width:1320px){.topbar{grid-template-columns:auto 1fr auto}.mode-tabs{grid-column:1/-1;justify-self:end}.a-grid{grid-template-columns:200px minmax(420px,1fr)}.a-grid>.inspector{grid-column:1/-1;min-height:auto}.inspector{display:grid;grid-template-columns:170px 1fr;gap:14px}.inspector::before,.inspector nav{grid-column:1/-1}.doc-block[aria-pressed=true]::after{display:none}.b-wrap{grid-template-columns:1fr}.fact-rail{min-height:auto}.semantic-spine{grid-template-columns:repeat(5,160px);overflow-x:auto;padding-bottom:8px}.branches{grid-template-columns:repeat(3,250px);overflow-x:auto;padding:0 8px 10px 0}}
    @media(max-width:820px){.shell{padding-inline:14px}.topbar{grid-template-columns:auto 1fr}.version-seal{justify-self:end}.thesis{grid-column:1/-1;grid-row:2}.mode-tabs{grid-row:3}.c-wrap{grid-template-columns:170px minmax(0,1fr)}.focus-card{padding:28px 22px}.map-detail{grid-template-columns:1fr}}
    @media(max-width:620px){body{padding-bottom:64px}.shell{padding:13px 12px 25px}.proto{gap:5px 12px;padding:6px 12px}.proto>span{display:none}.topbar{display:grid;grid-template-columns:1fr auto;gap:12px;padding-top:7px}.brand{min-width:0}.brand small{font-size:7px}.version-seal{min-width:94px;padding:7px 8px}.version-seal b{font-size:10px}.thesis{grid-column:1/-1;display:block;font-size:28px;line-height:1.04;white-space:normal}.thesis span,.thesis em{display:block;white-space:nowrap}.thesis small{display:block;margin:8px 0 0;text-align:left}.mode-tabs{grid-column:1/-1;width:100%;overflow:auto}.mode-tabs::before{display:none}.mode-tabs button{flex:1}.meta-strip{display:flex;align-items:flex-start;flex-wrap:wrap}.meta-strip .candidate{width:auto;max-width:100%;justify-self:auto}.candidate-long{display:none}.candidate-short{display:inline}.sep{display:none}.a-grid{display:block}.sidebar{min-height:auto;margin-bottom:10px}.outline{display:flex;overflow-x:auto;padding-bottom:6px}.outline-group{display:none}.outline button{min-width:165px}.paper{min-height:auto;padding:38px 21px 30px}.paper::before{display:none}.paper::after{left:9px}.paper-head{padding-left:5px}.doc-block{margin-inline:-9px}.inspector{display:block;min-height:auto;margin-top:10px}.storyboard{grid-template-columns:1fr}.b-wrap{display:block}.map{padding:18px 13px;overflow:hidden}.map::before{display:none}.map-title{display:block}.semantic-spine{grid-template-columns:repeat(5,155px)}.branches{grid-template-columns:repeat(3,225px)}.c-wrap{display:block}.receipt{grid-template-columns:1fr 1fr;margin-bottom:14px}.receipt>div:nth-child(2){border-right:0}.receipt>div:nth-child(-n+2){border-bottom:1px solid var(--rule)}.stepper{flex-direction:row;overflow-x:auto;border-left:0;border-bottom:1px solid var(--ink);margin-bottom:13px}.step{min-width:122px;padding:11px 8px;text-align:center;border-right:1px solid var(--rule);border-bottom:0}.step::before{display:none}.step[aria-pressed=true]::after{display:none}.choice-grid,.boundary-grid{grid-template-columns:1fr}.focus-card{min-height:auto;padding:25px 17px}.focus-head{gap:12px}.focus-head h1{font-size:29px}.state{width:auto;margin:12px 12px 22px}.compare{grid-template-columns:1fr}.axis{grid-template-columns:92px 1fr}.switcher{bottom:10px;max-width:calc(100vw - 20px)}.switcher div{min-width:0;width:210px;max-width:calc(100vw - 88px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  (function(){
    "use strict";
    const variants=[{key:"A",name:"校样读批台"},{key:"B",name:"同根三册对照"},{key:"C",name:"纵向签核单"}];
    const shared={
      title:"vNext 五大 State Owner 与可控 Writing",version:"W-v3",parent:"W-v2",snapshot:"RG-Snapshot 2026-08-10 · r184",newSnapshot:"RG-Snapshot 2026-08-12 · r191",
      unit:"claim + evidence + limitation（候选，待用户确认）",
      sections:[
        {id:"claim",label:"核心主张",title:"完成执行，不等于接纳结果",text:"Agent Runtime 的 execution completed、领域 Owner 的 asset accepted 与 Advancement Engine 的 Stage advanced 是三个不同事实。",sources:[
          {title:"细化五大核心 Module 的权威状态、非职责与依赖禁区",ref:"Resolution comment · issuecomment-5227752361",url:"https://github.com/15253a/meta_research/issues/83#issuecomment-5227752361",supports:"支持：单一 State Owner、执行／接纳／推进分离。",excludes:"不支持：paper／报告／PPT 的结构选择。"},
          {title:"定义 Human Collaboration 显式意图、确认与授权合同",ref:"Resolution comment · issuecomment-5239269365",url:"https://github.com/15253a/meta_research/issues/59#issuecomment-5239269365",supports:"支持：用户意图、Owner 接纳与实际效果分层。",excludes:"不支持：Writing citation 的正式接纳规则。"}
        ],status:"complete"},
        {id:"evidence",label:"证据链",title:"每项事实只有一个 Owner",text:"界面可以聚合只读 Projection，但不能借展示方便创造一份新的权威总状态。",sources:[
          {title:"定义 Research Memory 受管资产、custody 转交与活跃引用合同",ref:"Resolution comment · issuecomment-5238753918",url:"https://github.com/15253a/meta_research/issues/66#issuecomment-5238753918",supports:"支持：不可变 AssetVersion、精确 MemoryRef 与 custody。",excludes:"不支持：资产自动获得研究意义。"},
          {title:"定义 HumanRequest 的局部阻塞、响应接纳与恢复合同",ref:"Resolution comment · issuecomment-5243676382",url:"https://github.com/15253a/meta_research/issues/87#issuecomment-5243676382",supports:"支持：响应、业务满足与恢复必须分离。",excludes:"不支持：Writing Run 的恢复状态机。"}
        ],status:"complete"},
        {id:"limitation",label:"限制",title:"Writing 合同仍未完成",text:"Writing Run、正式 citation 接纳、renderer 以及导出／发布／投稿边界仍由后续决策确定。",sources:[
          {title:"定义 Writing 的端到端运行、交付物、citation 与外部交付合同",ref:"Open Question · not a Resolution",url:"https://github.com/15253a/meta_research/issues/75",supports:"支持：这些 Writing 边界仍是待决问题。",excludes:"不提供：任何已接纳的 Run、citation 或发布语义。"}
        ],status:"incomplete"}
      ]
    };
    const state={variant:"A",deliverable:"报告",selected:"claim",tab:"来源",compareAxis:"内容",revisionMode:"deliverable",revisionText:"保持研究结论不变，把这一段压缩成一句给决策者看的摘要。",lastMockAction:null,B:{version:"报告 W-v3"},C:{step:1,type:"报告",boundary:"deliverable",outcome:null},coreWrites:0,persistence:"none — browser memory only",question:"paper／报告／PPT 是否共享 claim + evidence + limitation 语义单元，只在组织与叙事上分化？"};
    const esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const curSection=()=>shared.sections.find(x=>x.id===state.selected)||shared.sections[0];
    const coordinate=id=>({claim:"C-01",evidence:"E-02",limitation:"L-03"}[id]||"T-00");
    function locator(type=state.deliverable,id=state.selected){const index={claim:0,evidence:1,limitation:2}[id]||0;return type==="PPT"?`Slide ${String(index+2).padStart(2,"0")} / block ${id}`:type==="Paper"?`§${["3.1","3.2","4.1"][index]} / block ${id}`:`${["关键发现","证据与依据","限制与下一步"][index]} / block ${id}`}
    function sourceCards(s){return s.sources.map((x,i)=>`<a class="source-card" href="${x.url}" target="_blank" rel="noreferrer"><span class="source-coordinate">${coordinate(s.id)} / REF-${String(i+1).padStart(2,"0")}</span><span class="source-title">${x.title} ↗</span><small class="mono">${x.ref}</small><small class="support">${x.supports}<br><span class="not-support">${x.excludes}</span></small></a>`).join("")}
    function typeButtons(){return `<div class="mode-tabs" aria-label="交付类型">${["Paper","报告","PPT"].map(x=>`<button data-type="${x}" aria-pressed="${state.deliverable===x}">${x}</button>`).join("")}</div>`}
    function header(label){return `<div class="proto"><b>ISSUE 76 / PROTOTYPE ${state.variant}</b><span>SYNTHETIC · READ ONLY · CORE WRITES 0</span><span>${label}</span></div><div class="shell"><header class="topbar"><div class="brand"><span class="brand-mark">W·76</span><div><strong>Writing Proofroom</strong><small>校样与批注道 · ${label}</small></div></div><div class="thesis"><span>先冻结证据，</span><em>再编辑表达。</em><small>TRACEABLE WRITING<br>FROZEN SNAPSHOT</small></div><div class="version-seal" aria-label="当前版本签封"><b>W-v3 / RG r184</b><small>父版本 W-v2 · FROZEN</small></div>${typeButtons()}</header>${meta()}`}
    function meta(){return `<div class="meta-strip"><b>${shared.version}</b><span class="muted">父版本 ${shared.parent}</span><span class="sep"></span><span class="mono">${shared.snapshot}</span><span class="chip stale">输入已有更新</span><span class="chip incomplete">1 项不完整</span><span class="grow"></span><span class="chip candidate"><span class="candidate-long">${shared.unit}</span><span class="candidate-short">共享语义候选 · 待确认</span></span></div>`}
    function outline(){return `<div class="outline"><div class="outline-group">共享语义候选</div>${shared.sections.map(s=>`<button data-section="${s.id}" aria-pressed="${state.selected===s.id}"><b>${coordinate(s.id)} · ${s.label}</b><small>${s.title}</small>${s.status==="incomplete"?'<span class="chip incomplete">不完整</span>':""}</button>`).join("")}<div class="outline-group">${state.deliverable} 特有组织</div>${typeSpecific().map(x=>`<button><b class="mono">${state.deliverable.toUpperCase()}</b><small>${x}</small></button>`).join("")}</div>`}
    function typeSpecific(){return state.deliverable==="Paper"?["摘要与研究问题","相关工作与方法","论证、讨论与局限"]:state.deliverable==="PPT"?["开场：为什么现在要关心","证据转折与关键发现","行动结尾与已知限制"]:["执行摘要与决策背景","关键发现与建议","风险、限制与下一步"]}
    function content(){
      if(state.deliverable==="PPT")return `<div class="storyboard">${shared.sections.map((s,i)=>`<button class="slide" data-section="${s.id}" aria-pressed="${state.selected===s.id}"><small>SLIDE ${i+2} · ${s.label} · ${coordinate(s.id)}</small><b>${s.title}</b><span class="citation">${s.sources.length} 个精确来源 ↗</span></button>`).join("")}<button class="slide"><small>SLIDE 05 · 类型特有</small><b>下一步决策</b><span class="muted">结尾行动节奏</span></button></div>`;
      return `<div class="doc">${shared.sections.map(s=>`<button class="doc-block" data-section="${s.id}" aria-pressed="${state.selected===s.id}"><span class="label">${s.label}</span><span class="coord">${coordinate(s.id)}</span><h2>${s.title}</h2><p>${s.text} <span class="citation">[${s.sources.length} exact refs]</span></p></button>`).join("")}</div>`
    }
    function inspector(){const s=curSection();return `<aside class="panel pad inspector"><nav>${["来源","修订","版本"].map(x=>`<button data-tab="${x}" aria-pressed="${state.tab===x}">${x}</button>`).join("")}</nav>${state.tab==="来源"?sources(s):state.tab==="修订"?revision(s):versions()}</aside>`}
    function sources(s){return `<div class="trace-readout"><span>${coordinate(s.id)}</span><b>${s.sources.length} 条精确引证已对齐</b><small>claim → support boundary → Resolution</small></div><div class="eyebrow">当前局部 · ${s.label}</div><h2>${s.title}</h2><dl class="axis"><dt>精确位置</dt><dd class="mono">${locator()}</dd><dt>绑定版本</dt><dd>${shared.version}</dd><dt>输入快照</dt><dd class="mono">r184 · frozen</dd></dl>${sourceCards(s)}<div class="rule"></div><dl class="axis"><dt>RM 内容</dt><dd><span class="chip ok">AssetVersion accepted</span></dd><dt>RG 绑定</dt><dd><span class="chip ok">研究事实只读</span></dd><dt>Writing citation</dt><dd><span class="chip candidate">合同待决</span></dd></dl><div class="notice">研究输入已更新到 r191；当前交付物仍精确绑定 r184。这里展示“陈旧风险”，不自动作正式 stale 裁决。</div>`}
    function revision(s){return `<div class="revision-box"><div class="eyebrow">局部修订 · 精确目标</div><h2>${s.label} / ${s.title}</h2><div class="locked"><b>锁定，不自动漂移</b><br>${locator()}<br>${shared.version} ← ${shared.snapshot}</div><div class="seg" style="margin:12px 0"><button data-revision-mode="deliverable" aria-pressed="${state.revisionMode==="deliverable"}">只改交付物</button><button data-revision-mode="research" aria-pressed="${state.revisionMode==="research"}">可能改变研究事实</button></div><textarea data-revision-text aria-label="修订要求">${esc(state.revisionText)}</textarea><div class="notice ${state.revisionMode==="deliverable"?"safe":""}" style="margin:10px 0">${state.revisionMode==="deliverable"?"会产生新的交付物候选；不会改 Answer、Evidence 或研究事实。":"这不是局部改稿。原型将转为“提出研究变更”，不会直接反转结论。"}</div><button class="primary" ${state.revisionMode==="deliverable"?"data-mock":"data-research-change"}>${state.revisionMode==="deliverable"?"预览局部修订":"提出研究变更"}</button></div>`}
    function versions(){const diffs={"内容":["执行完成即代表交付完成。","执行完成、资产接纳和推进始终分离。"],"证据":["聚合状态，无精确来源边界。","两个精确 Resolution，并将 RM 内容与 RG 研究绑定分轴。"],"Citation":["未验证脚注指向动态 latest。","citation candidate 指向精确位置；正式接纳仍待后续合同。"]},d=diffs[state.compareAxis];return `<div class="eyebrow">版本比较</div><h2>${shared.parent} → ${shared.version}</h2><div class="seg">${["内容","证据","Citation"].map(x=>`<button data-axis="${x}" aria-pressed="${state.compareAxis===x}">${x}</button>`).join("")}</div><div class="compare" style="margin-top:12px"><div><span class="chip">${shared.parent}</span><p><span class="del">${d[0]}</span></p><small class="muted">Snapshot r177</small></div><div><span class="chip ok">${shared.version}</span><p><span class="add">${d[1]}</span></p><small class="muted">Snapshot r184 · 当前查看 ${state.compareAxis} diff</small></div></div><div class="notice" style="margin-top:10px">比较不会把任一版本重定向到 latest；两个版本都保留自己的精确 Snapshot。</div>`}
    function variantA(){return `${header("A · 校样读批台")}<div class="a-grid"><aside class="panel pad sidebar"><div class="sidebar-head"><div class="eyebrow">校样索引</div><h2>读稿、查源、落批注</h2></div>${outline()}</aside><main class="panel paper"><div class="paper-head"><div class="eyebrow">${state.deliverable} · ${typeSpecific()[0]}</div><h1>${shared.title}</h1><p>用一个清晰的叙事说明：为什么权威事实必须分离，以及 Writing 如何在不改写研究事实的前提下形成可追溯交付物。</p></div>${content()}</main>${inspector()}</div></div>`}
    function variantB(){const s=curSection();return `${header("B · 同根三册对照")}<div class="b-wrap"><aside class="panel pad fact-rail"><div class="eyebrow">只读研究输入</div><h2>RG Snapshot r184</h2><div class="readonly">研究事实区域不可编辑。修改只会在右侧形成新的交付物版本。</div>${shared.sections.map(s=>`<button class="source-card" data-section="${s.id}" aria-pressed="${state.selected===s.id}"><b>${coordinate(s.id)} · ${s.label}</b><small>${s.title}</small></button>`).join("")}<div class="rule"></div><span class="chip stale">新 Snapshot r191 可用</span><p class="muted" style="font-size:12px;margin-top:9px">不会静默更新既有分支。</p><button class="secondary danger-lite" data-research-change>提出研究变更</button></aside><main class="panel map"><div class="map-title"><div><div class="eyebrow">跨类型共享候选</div><h1>同一语义脊柱，装订为三种叙事</h1></div><span class="grow"></span><span class="chip candidate">待现场确认</span></div><div class="semantic-spine">${shared.sections.map(s=>`<button class="node" data-section="${s.id}" aria-pressed="${state.selected===s.id}"><span class="node-coordinate">${coordinate(s.id)}</span><b>${s.label}</b><span>${s.title}</span><small class="muted">${s.sources.length} exact refs</small></button>`).join("")}<button class="node"><span class="node-coordinate">FORMAT</span><b>类型组织</b><span>结构在此分化</span></button><button class="node"><span class="node-coordinate">READER</span><b>读者动作</b><span>理解／决策／讲述</span></button></div><div class="branches">${["Paper","报告","PPT"].map(t=>`<section class="branch"><div class="branch-head"><span class="brand-mark" style="width:28px;height:28px">${t[0]}</span><b>${t}</b></div><button class="version" data-version="${t} W-v3" aria-pressed="${state.B.version===t+' W-v3'}"><b>${t} W-v3</b><small>Snapshot r184 · ${t==="Paper"?"current":t==="报告"?"输入已有更新":"1 项不完整"}</small></button><div class="lineage"><span class="dot"></span><span class="connector"></span><span class="dot"></span><span class="connector"></span><span class="dot"></span></div>${typeSpecificFor(t).map(x=>`<div class="readonly">${x}</div>`).join("")}</section>`).join("")}</div><div class="map-detail"><section><div class="eyebrow">选中语义单元 · ${coordinate(s.id)} · ${s.label}</div><h2>${s.title}</h2><p class="muted">${s.text}</p>${sourceCards(s)}</section><section><div class="eyebrow">选中版本</div><h2>${state.B.version}</h2><dl class="axis"><dt>精确位置</dt><dd class="mono">${locator()}</dd><dt>父版本</dt><dd>W-v2</dd><dt>冻结输入</dt><dd class="mono">RG r184</dd><dt>内容</dt><dd>RM AssetVersion accepted</dd></dl><div class="rule"></div><h3>修订只在交付物侧分叉</h3><p class="muted">若质疑底层结论，离开 Writing 分支并提出研究变更；不会拖动或覆盖左侧事实。</p><button class="primary" data-mock>从精确版本创建修订候选</button></section></div></main></div></div>`}
    function typeSpecificFor(t){return t==="Paper"?["学术论证","方法与讨论"]:t==="PPT"?["逐页节奏","讲述转折"]:["决策摘要","建议与风险"]}
    function focusBody(){const step=state.C.step;if(step===1)return `<div class="choice-grid">${["Paper","报告","PPT"].map(t=>`<button class="choice" data-c-type="${t}" aria-pressed="${state.C.type===t}"><b>${t}</b><span>${t==="Paper"?"严谨论证与学术读者":t==="报告"?"清晰结论与决策行动":"逐页叙事与现场讲述"}</span></button>`).join("")}</div>`;if(step===2)return `<div class="notice">以下是需要你判断的候选，而不是既定规范：三类交付物都共享 claim + evidence + limitation，再以不同组织方式服务读者。</div>${shared.sections.map((s,i)=>`<div class="review-item"><span class="count">${i+1}</span><div><b>${s.label} · ${s.title}</b><p class="muted">${s.text}</p></div>${s.status==="incomplete"?'<span class="chip incomplete">不完整</span>':'<span class="chip ok">可追踪</span>'}</div>`).join("")}`;if(step===3)return `${sources(curSection())}<div class="button-row"><button class="secondary" data-section="claim">查看核心主张</button><button class="secondary" data-section="evidence">查看证据链</button><button class="secondary" data-section="limitation">查看限制</button></div>`;if(step===4)return `<div class="locked"><b>精确修订目标</b><br>${locator(state.C.type)}<br>${shared.version} ← ${shared.snapshot}</div><textarea data-c-revision-text aria-label="修订或研究变更要求" style="width:100%;min-height:82px;margin:12px 0;border:1px solid var(--line);border-radius:1px;padding:10px">${esc(state.revisionText)}</textarea><div class="boundary-grid"><button class="boundary" data-boundary="deliverable" aria-pressed="${state.C.boundary==="deliverable"}"><span class="chip ok">Writing 内</span><h2>只改这个交付物</h2><p>产生新的交付物候选，不改变 Answer、Evidence 或研究事实。</p></button><button class="boundary" data-boundary="research" aria-pressed="${state.C.boundary==="research"}"><span class="chip stale">离开 Writing</span><h2>我认为研究事实有误</h2><p>提出研究变更；不允许在文稿里直接把结论改成相反说法。</p></button></div>${state.C.outcome==="research-change-drafted"?'<div class="notice" style="margin-top:12px"><b>已离开 Writing（mock）。</b> 研究变更草案已准备；交付物和研究事实均未改变，版本比较不会继续。</div>':""}`;return `${versions()}<div class="notice safe" style="margin-top:14px">这一步只比较局部修订候选；不代表发布、citation 接纳或正式 Writing 合同已完成。</div>`}
    function variantC(){const labels=["选择类型","确认结构","检查来源","提出修订","比较反馈"],nextLabel=state.C.step===5?"记录 mock 反馈":state.C.step===4?(state.C.boundary==="research"?(state.C.outcome?"已离开 Writing（mock）":"提出研究变更（mock）"):"生成局部修订候选 →"):"继续 →";return `${header("C · 纵向签核单")}<div class="c-wrap"><div class="receipt">${[["交付物",state.C.type+" "+shared.version],["父版本",shared.parent],["冻结输入","RG r184"],["状态","输入已有更新 / 1 项不完整"]].map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b></div>`).join("")}</div><div class="stepper">${labels.map((x,i)=>`<button class="step" data-step="${i+1}" aria-pressed="${state.C.step===i+1}">${i+1} · ${x}</button>`).join("")}</div><main class="panel focus-card"><div class="focus-head"><span class="focus-num">${state.C.step}</span><div><div class="eyebrow">编辑签核任务</div><h1 style="font-size:30px">${labels[state.C.step-1]}</h1><p class="muted">${["先明确读者和叙事用途。","判断共享语义候选是否自然。","找到一条结论的精确支持与边界。","明确改交付物与改研究事实的分界。","比较前后版本并说明你更信任哪个。"] [state.C.step-1]}</p></div></div>${focusBody()}<div class="flow-actions"><button class="secondary" data-prev ${state.C.step===1?"disabled":""}>← 上一步</button><button class="primary" data-next ${state.C.step===4&&state.C.outcome?"disabled":""}>${nextLabel}</button></div></main></div></div>`}
    function render(){state.variant=fromUrl();document.body.dataset.variant=state.variant;document.body.dataset.selected=state.selected;document.getElementById("app").innerHTML=state.variant==="A"?variantA():state.variant==="B"?variantB():variantC();bind();chrome();updateState()}
    function fromUrl(){const k=(new URL(location.href).searchParams.get("variant")||"A").toUpperCase();return variants.some(v=>v.key===k)?k:"A"}
    function setVariant(k){const u=new URL(location.href);u.searchParams.set("variant",k);history.replaceState({},"",u);state.variant=k;render()}
    function cycle(d){const i=variants.findIndex(v=>v.key===state.variant);setVariant(variants[(i+d+variants.length)%variants.length].key)}
    function bind(){
      document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{state.deliverable=b.dataset.type;if(state.variant==="B")state.B.version=b.dataset.type+" W-v3";if(state.variant==="C")state.C.type=b.dataset.type;render()});
      document.querySelectorAll("[data-section]").forEach(b=>b.onclick=()=>{state.selected=b.dataset.section;render()});
      document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
      document.querySelectorAll("[data-axis]").forEach(b=>b.onclick=()=>{state.compareAxis=b.dataset.axis;render()});
      document.querySelectorAll("[data-revision-mode]").forEach(b=>b.onclick=()=>{state.revisionMode=b.dataset.revisionMode;render()});
      const ta=document.querySelector("[data-revision-text]");if(ta)ta.oninput=e=>{state.revisionText=e.target.value;updateState()};
      document.querySelectorAll("[data-version]").forEach(b=>b.onclick=()=>{state.B.version=b.dataset.version;state.deliverable=b.dataset.version.replace(" W-v3","");render()});
      document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{const next=Number(b.dataset.step);if(state.C.outcome==="research-change-drafted"&&next===5){toast("已离开 Writing；研究变更不能进入交付物版本比较。");return}state.C.step=next;if(next!==4)state.C.outcome=null;render()});
      document.querySelectorAll("[data-c-type]").forEach(b=>b.onclick=()=>{state.C.type=b.dataset.cType;state.deliverable=b.dataset.cType;render()});
      document.querySelectorAll("[data-boundary]").forEach(b=>b.onclick=()=>{state.C.boundary=b.dataset.boundary;state.C.outcome=null;render()});
      const cta=document.querySelector("[data-c-revision-text]");if(cta)cta.oninput=e=>{state.revisionText=e.target.value;updateState()};
      document.querySelectorAll("[data-prev]").forEach(b=>b.onclick=()=>{state.C.step=Math.max(1,state.C.step-1);state.C.outcome=null;render()});
      document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>{if(state.C.step===4){if(state.C.boundary==="research"){state.C.outcome="research-change-drafted";state.lastMockAction="left Writing; research-change draft prepared; facts unchanged";render()}else{state.C.outcome="deliverable-candidate";state.lastMockAction="local deliverable candidate from W-v3 + r184";state.C.step=5;render()}return}if(state.C.step<5){state.C.step++;render()}else{state.lastMockAction="HITL feedback recorded in browser memory";updateState();toast("反馈只保存在浏览器内存；GitHub 与核心系统写入均为 0。")}});
      document.querySelectorAll("[data-mock]").forEach(b=>b.onclick=()=>{state.lastMockAction="deliverable candidate preview; facts unchanged";updateState();toast("已生成 mock 候选；未写入研究事实、资产或 GitHub。");});
      document.querySelectorAll("[data-research-change]").forEach(b=>b.onclick=()=>{state.lastMockAction="left Writing; research-change draft prepared; facts unchanged";updateState();toast("已离开 Writing 修订路径（mock）；研究事实没有改变。");});
    }
    function chrome(){document.querySelectorAll(".switcher,.state").forEach(x=>x.remove());const v=variants.find(x=>x.key===state.variant);const nav=document.createElement("nav");nav.className="switcher";nav.setAttribute("aria-label","Prototype 方案切换");nav.innerHTML=`<button data-cycle="-1" aria-label="上一个方案">←</button><div><b>${v.key}</b> — ${v.name}</div><button data-cycle="1" aria-label="下一个方案">→</button>`;nav.querySelectorAll("button").forEach(b=>b.onclick=()=>cycle(Number(b.dataset.cycle)));document.querySelector(".proto").appendChild(nav);const det=document.createElement("details");det.className="state";det.innerHTML='<summary>FULL RELEVANT PROTOTYPE STATE</summary><pre id="state-json"></pre>';document.body.appendChild(det)}
    function updateState(){const el=document.getElementById("state-json");if(el)el.textContent=JSON.stringify({...state,selectedSection:curSection().label,localTarget:locator(),lockedBinding:{deliverableVersion:shared.version,inputSnapshot:shared.snapshot},authorityBoundary:"修改交付物不等于改变研究事实"},null,2)}
    function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
    addEventListener("popstate",render);addEventListener("keydown",e=>{const t=e.target;const editing=t&&(t.matches?.("input,textarea,select")||t.isContentEditable);if(editing)return;if(e.key==="ArrowLeft"){e.preventDefault();cycle(-1)}if(e.key==="ArrowRight"){e.preventDefault();cycle(1)}});render();
  }());
  </script>
</body>
</html>
