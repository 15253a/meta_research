<!doctype html>
<html lang="zh-CN" data-prototype-route="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">

  <title>Writing 交付物结构与修订体验 · Throwaway Prototype</title>
  <!-- Three structural UI variants for issue 76, switchable via ?variant=A|B|C. -->
  <style>
    :root{
      --ink:#17221f;--muted:#65706c;--paper:#fffefa;--canvas:#f1f0e9;--line:#d9ddd5;
      --green:#174f43;--green-2:#e3f0eb;--blue:#315f80;--blue-2:#e9f1f7;
      --amber:#976018;--amber-2:#fff3d8;--rose:#9b493f;--rose-2:#fbe9e5;
      --shadow:0 16px 42px rgba(28,42,36,.09);--radius:18px;--sans:Inter,"Noto Sans SC",system-ui,sans-serif;
      --serif:"Noto Serif SC","Source Han Serif SC",Georgia,serif
    }
    *{box-sizing:border-box}html{background:var(--canvas);color:var(--ink);font-family:var(--sans)}
    body{margin:0;min-width:320px;background:radial-gradient(circle at 10% -10%,#fff 0,transparent 34%),var(--canvas)}
    button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid #65a995;outline-offset:2px}
    h1,h2,h3,p{margin-top:0}h1{font-family:var(--serif);font-size:clamp(25px,3vw,42px);letter-spacing:-.035em;line-height:1.12}h2{font-size:18px}h3{font-size:14px}.muted{color:var(--muted)}
    .proto{min-height:34px;padding:7px 18px;background:#15221e;color:#f6f6ef;display:flex;gap:18px;align-items:center;font-size:11px;letter-spacing:.08em}.proto span{opacity:.7}
    .shell{max-width:1800px;margin:auto;padding:18px 22px 125px}.topbar{display:flex;align-items:center;gap:14px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:36px;height:36px;border-radius:11px;background:var(--green);color:white;display:grid;place-items:center;font-family:var(--serif);font-weight:700}.grow{flex:1}.mode-tabs,.seg{display:flex;gap:3px;padding:4px;background:rgba(255,255,255,.65);border:1px solid var(--line);border-radius:12px}.mode-tabs button,.seg button,.soft-btn{border:0;background:transparent;padding:8px 11px;border-radius:8px;font-weight:650}.mode-tabs button[aria-pressed=true],.seg button[aria-pressed=true]{background:#fff;box-shadow:0 3px 12px rgba(20,40,32,.08);color:var(--green)}
    .chip{display:inline-flex;gap:6px;align-items:center;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:11px;font-weight:700;line-height:1}.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:#88938e}.chip.stale{color:var(--amber);background:var(--amber-2);border-color:#e6c991}.chip.stale::before{background:var(--amber)}.chip.incomplete{color:var(--rose);background:var(--rose-2);border-color:#e4bab4}.chip.incomplete::before{background:var(--rose)}.chip.ok{color:var(--green);background:var(--green-2);border-color:#afd1c5}.chip.ok::before{background:var(--green)}.chip.candidate{color:var(--blue);background:var(--blue-2);border-color:#bfd3e1}.chip.candidate::before{background:var(--blue)}
    .panel{background:rgba(255,254,250,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.pad{padding:16px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--muted);font-weight:800}.meta-strip{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:11px 14px;margin-bottom:14px;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:14px}.meta-strip b{font-size:12px}.sep{width:1px;height:22px;background:var(--line)}
    .outline button,.list-btn,.source-card,.node,.step,.doc-block,.slide,.version{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:11px;padding:10px}.outline button:hover,.list-btn:hover,.source-card:hover,.node:hover,.doc-block:hover,.slide:hover,.version:hover{background:#f6f6f0}.outline button[aria-pressed=true],.list-btn[aria-pressed=true],.source-card[aria-pressed=true],.doc-block[aria-pressed=true],.slide[aria-pressed=true],.version[aria-pressed=true]{background:var(--green-2);border-color:#b8d6cc}.outline small,.source-card small,.version small{display:block;color:var(--muted);margin-top:4px}.source-card{display:block;color:inherit;text-decoration:none}.source-card .support{padding-top:6px;margin-top:7px;border-top:1px solid var(--line);line-height:1.45}.source-card .not-support{color:var(--rose)}.rule{height:1px;background:var(--line);margin:14px 0}.primary{border:0;border-radius:11px;background:var(--green);color:#fff;padding:10px 13px;font-weight:750}.secondary{border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px 13px;font-weight:700}.danger-lite{color:var(--rose);background:var(--rose-2);border-color:#e2b7b1}.button-row{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:11px 12px;border-radius:12px;background:var(--amber-2);border:1px solid #e9ce9e;font-size:12px;line-height:1.5}.safe{background:var(--green-2);border-color:#bad8ce}.axis{display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:12px;margin:7px 0}.axis dt{color:var(--muted)}.axis dd{margin:0;font-weight:650}.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px}
    /* A: professional review desk */
    .a-grid{display:grid;grid-template-columns:220px minmax(420px,1fr) 310px;gap:12px}.sidebar{min-height:680px}.sidebar-head{padding:4px 4px 11px}.outline-group{margin:14px 0 6px;padding:0 10px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em}.paper{min-height:720px;padding:clamp(22px,4vw,58px);background:var(--paper);position:relative;overflow:hidden}.paper::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--green),#82ad9f 55%,transparent)}.paper-head{max-width:760px;margin:0 auto 28px}.paper-head p{font-family:var(--serif);color:#56615d;line-height:1.7}.doc{max-width:760px;margin:auto}.doc-block{padding:16px 18px;margin:6px -18px}.doc-block .label{font-size:10px;letter-spacing:.1em;color:var(--green);font-weight:800}.doc-block h2{font-family:var(--serif);font-size:21px;margin:7px 0}.doc-block p{font-family:var(--serif);line-height:1.85;margin-bottom:0}.citation{color:var(--green);font-family:var(--sans);font-size:11px;font-weight:750;white-space:nowrap}.inspector{min-height:680px;position:relative}.inspector nav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-16px -16px 14px;padding:8px 8px 0}.inspector nav button{flex:1;border:0;background:transparent;padding:9px 5px;border-radius:8px 8px 0 0;font-size:12px;font-weight:700}.inspector nav button[aria-pressed=true]{background:var(--green-2);color:var(--green)}.source-card{border-color:var(--line);background:#fff;margin:8px 0}.source-title{font-weight:750;font-size:12px}.revision-box textarea{width:100%;min-height:92px;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff;resize:vertical}.locked{padding:9px 10px;border:1px dashed #b7c5bf;border-radius:10px;background:#f5f7f4;font-size:11px;line-height:1.55}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare>div{padding:15px;border:1px solid var(--line);border-radius:12px;background:#faf9f4}.del{background:#fbe3df;text-decoration:line-through}.add{background:#dff1e8}.storyboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.slide{aspect-ratio:16/9;border-color:var(--line);background:#fff;display:flex;flex-direction:column;justify-content:space-between}.slide b{font-family:var(--serif);font-size:18px}.slide small{color:var(--muted)}
    /* B: lineage map */
    .b-wrap{display:grid;grid-template-columns:240px 1fr;gap:12px}.fact-rail{min-height:650px}.readonly{padding:9px 10px;border-radius:10px;background:#f0f2ef;font-size:11px;color:#52605a}.map{min-height:650px;padding:22px;overflow:auto}.map-title{display:flex;align-items:start;gap:14px}.semantic-spine{display:grid;grid-template-columns:repeat(5,minmax(128px,1fr));gap:12px;margin:38px 0 28px;position:relative}.semantic-spine::before{content:"";position:absolute;left:5%;right:5%;top:50%;height:2px;background:#c5d4ce}.node{position:relative;background:var(--paper);border-color:var(--line);min-height:100px;z-index:1}.node b{display:block;margin-bottom:6px}.branches{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.branch{border:1px solid var(--line);border-radius:15px;padding:13px;background:#f8f8f3}.branch-head{display:flex;align-items:center;gap:8px;margin-bottom:11px}.branch-head b{font-family:var(--serif);font-size:17px}.version{border-color:var(--line);background:#fff;margin:7px 0}.lineage{display:flex;align-items:center;gap:6px;overflow:auto;padding:12px 0}.dot{min-width:10px;height:10px;border-radius:50%;background:var(--green)}.connector{min-width:24px;height:1px;background:#a9b8b2}.map-detail{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.map-detail section{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.fact-rail .source-card{font-size:12px}
    /* C: focused review flow */
    .c-wrap{max-width:1050px;margin:auto}.receipt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.receipt>div{padding:11px;border-radius:12px;background:#fff;border:1px solid var(--line)}.receipt small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:20px 0}.step{padding:9px 7px;text-align:center;font-size:11px;color:var(--muted)}.step[aria-pressed=true]{background:var(--green);color:#fff}.focus-card{min-height:510px;padding:clamp(20px,4vw,46px)}.focus-head{display:flex;gap:16px;align-items:start;margin-bottom:25px}.focus-num{width:42px;height:42px;border-radius:50%;background:var(--green-2);color:var(--green);display:grid;place-items:center;font-family:var(--serif);font-size:20px;font-weight:700}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{border:1px solid var(--line);border-radius:15px;background:#fff;padding:16px;text-align:left;min-height:140px}.choice[aria-pressed=true]{border:2px solid var(--green);background:var(--green-2)}.choice b{font-family:var(--serif);font-size:18px;display:block;margin-bottom:8px}.review-item{display:grid;grid-template-columns:36px 1fr auto;align-items:start;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.review-item .count{width:30px;height:30px;border-radius:50%;background:#f0f1ed;display:grid;place-items:center;font-weight:700}.flow-actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.boundary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.boundary{border:1px solid var(--line);border-radius:16px;padding:20px;text-align:left;background:#fff}.boundary[aria-pressed=true]{border:2px solid var(--green);background:var(--green-2)}
    /* prototype chrome */
    .switcher{position:fixed;z-index:50;bottom:19px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:#14211d;color:#fff;box-shadow:0 15px 42px rgba(0,0,0,.28)}.switcher button{width:38px;height:38px;border:0;border-radius:50%;background:#293833;color:#fff}.switcher div{min-width:190px;text-align:center;font-size:12px}.switcher b{font-size:14px}.state{position:relative;z-index:49;width:min(320px,calc(100vw - 36px));margin:-105px 18px 72px auto;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);font-size:10px}.state summary{padding:10px 12px;font-weight:800;cursor:pointer}.state pre{margin:0;padding:0 12px 12px;max-height:190px;overflow:auto;white-space:pre-wrap}.toast{position:fixed;z-index:60;top:18px;left:50%;transform:translateX(-50%);background:#14211d;color:#fff;padding:11px 16px;border-radius:999px;box-shadow:var(--shadow);font-size:12px}
    @media(max-width:1100px){.a-grid{grid-template-columns:190px 1fr}.a-grid>.inspector{grid-column:1/-1;min-height:auto}.inspector{display:grid;grid-template-columns:160px 1fr;gap:14px}.inspector nav{grid-column:1/-1}.b-wrap{grid-template-columns:1fr}.fact-rail{min-height:auto}.semantic-spine{grid-template-columns:repeat(5,160px)}.branches{grid-template-columns:repeat(3,240px)}}
    @media(max-width:720px){.shell{padding:12px 12px 105px}.proto{flex-wrap:wrap;gap:4px 12px}.topbar{align-items:flex-start;flex-wrap:wrap}.mode-tabs{order:3;width:100%}.mode-tabs button{flex:1}.meta-strip{align-items:flex-start}.sep{display:none}.a-grid{display:block}.sidebar{min-height:auto;margin-bottom:10px}.outline{display:flex;overflow:auto}.outline-group{display:none}.outline button{min-width:155px}.paper{min-height:auto;padding:28px 20px}.inspector{display:block;min-height:auto;margin-top:10px}.storyboard{grid-template-columns:1fr}.b-wrap{display:block}.map{padding:14px}.semantic-spine{grid-template-columns:repeat(5,150px)}.branches{grid-template-columns:repeat(3,220px)}.map-detail{grid-template-columns:1fr}.receipt{grid-template-columns:1fr 1fr}.stepper{overflow:auto;grid-template-columns:repeat(5,130px)}.choice-grid,.boundary-grid{grid-template-columns:1fr}.focus-card{min-height:auto;padding:22px 17px}.state{position:relative;right:auto;bottom:auto;width:auto;margin:0 12px 82px}.switcher{bottom:12px}.switcher div{min-width:150px}.compare{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  (function(){
    "use strict";
    const variants=[{key:"A",name:"语义脊柱审稿台"},{key:"B",name:"交付物谱系地图"},{key:"C",name:"聚焦式验收流程"}];
    const shared={
      title:"vNext 五大 State Owner 与可控 Writing",version:"W-v3",parent:"W-v2",snapshot:"RG-Snapshot 2026-08-10 · r184",newSnapshot:"RG-Snapshot 2026-08-12 · r191",
      unit:"claim + evidence + limitation（候选，待用户确认）",
      sections:[
        {id:"claim",label:"核心主张",title:"完成执行，不等于接纳结果",text:"Agent Runtime 的 execution completed、领域 Owner 的 asset accepted 与 Advancement Engine 的 Stage advanced 是三个不同事实。",sources:[
          {title:"细化五大核心 Module 的权威状态、非职责与依赖禁区",ref:"Resolution comment · issuecomment-5227752361",url:"https://github.com/15253a/meta_research/issues/83#issuecomment-5227752361",supports:"支持：单一 State Owner、执行／接纳／推进分离。",excludes:"不支持：paper／报告／PPT 的结构选择。"},
          {title:"定义 Human Collaboration 显式意图、确认与授权合同",ref:"Resolution comment · issuecomment-5239269365",url:"https://github.com/15253a/meta_research/issues/59#issuecomment-5239269365",supports:"支持：用户意图、Owner 接纳与实际效果分层。",excludes:"不支持：Writing citation 的正式接纳规则。"}
        ],status:"complete"},
        {id:"evidence",label:"证据链",title:"每项事实只有一个 Owner",text:"界面可以聚合只读 Projection，但不能借展示方便创造一份新的权威总状态。",sources:[
          {title:"定义 Research Memory 受管资产、custody 转交与活跃引用合同",ref:"Resolution comment · issuecomment-5238753918",url:"https://github.com/15253a/meta_research/issues/66#issuecomment-5238753918",supports:"支持：不可变 AssetVersion、精确 MemoryRef 与 custody。",excludes:"不支持：资产自动获得研究意义。"},
          {title:"定义 HumanRequest 的局部阻塞、响应接纳与恢复合同",ref:"Resolution comment · issuecomment-5243676382",url:"https://github.com/15253a/meta_research/issues/87#issuecomment-5243676382",supports:"支持：响应、业务满足与恢复必须分离。",excludes:"不支持：Writing Run 的恢复状态机。"}
        ],status:"complete"},
        {id:"limitation",label:"限制",title:"Writing 合同仍未完成",text:"Writing Run、正式 citation 接纳、renderer 以及导出／发布／投稿边界仍由后续决策确定。",sources:[
          {title:"定义 Writing 的端到端运行、交付物、citation 与外部交付合同",ref:"Open Question · not a Resolution",url:"https://github.com/15253a/meta_research/issues/75",supports:"支持：这些 Writing 边界仍是待决问题。",excludes:"不提供：任何已接纳的 Run、citation 或发布语义。"}
        ],status:"incomplete"}
      ]
    };
    const state={variant:"A",deliverable:"报告",selected:"claim",tab:"来源",compareAxis:"内容",revisionMode:"deliverable",revisionText:"保持研究结论不变，把这一段压缩成一句给决策者看的摘要。",lastMockAction:null,B:{version:"报告 W-v3"},C:{step:1,type:"报告",boundary:"deliverable",outcome:null},coreWrites:0,persistence:"none — browser memory only",question:"paper／报告／PPT 是否共享 claim + evidence + limitation 语义单元，只在组织与叙事上分化？"};
    const esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const curSection=()=>shared.sections.find(x=>x.id===state.selected)||shared.sections[0];
    function locator(type=state.deliverable,id=state.selected){const index={claim:0,evidence:1,limitation:2}[id]||0;return type==="PPT"?`Slide ${String(index+2).padStart(2,"0")} / block ${id}`:type==="Paper"?`§${["3.1","3.2","4.1"][index]} / block ${id}`:`${["关键发现","证据与依据","限制与下一步"][index]} / block ${id}`}
    function sourceCards(s){return s.sources.map(x=>`<a class="source-card" href="${x.url}" target="_blank" rel="noreferrer"><span class="source-title">${x.title} ↗</span><small class="mono">${x.ref}</small><small class="support">${x.supports}<br><span class="not-support">${x.excludes}</span></small></a>`).join("")}
    function typeButtons(){return `<div class="mode-tabs" aria-label="交付类型">${["Paper","报告","PPT"].map(x=>`<button data-type="${x}" aria-pressed="${state.deliverable===x}">${x}</button>`).join("")}</div>`}
    function header(label){return `<div class="proto"><b>THROWAWAY PROTOTYPE · ${state.variant}</b><span>SYNTHETIC READ-ONLY DATA</span><span>${label}</span></div><div class="shell"><header class="topbar"><div class="brand"><span class="brand-mark">W</span><div><b>Writing Studio</b><div class="eyebrow">结构与修订体验实验</div></div></div><span class="grow"></span>${typeButtons()}</header>${meta()}`}
    function meta(){return `<div class="meta-strip"><b>${shared.version}</b><span class="muted">父版本 ${shared.parent}</span><span class="sep"></span><span class="mono">${shared.snapshot}</span><span class="chip stale">输入已有更新</span><span class="chip incomplete">1 项不完整</span><span class="grow"></span><span class="chip candidate">${shared.unit}</span></div>`}
    function outline(){return `<div class="outline"><div class="outline-group">共享语义候选</div>${shared.sections.map(s=>`<button data-section="${s.id}" aria-pressed="${state.selected===s.id}"><b>${s.label}</b><small>${s.title}</small>${s.status==="incomplete"?'<span class="chip incomplete">不完整</span>':""}</button>`).join("")}<div class="outline-group">${state.deliverable} 特有组织</div>${typeSpecific().map((x,i)=>`<button><b>${String(i+1).padStart(2,"0")}</b><small>${x}</small></button>`).join("")}</div>`}
    function typeSpecific(){return state.deliverable==="Paper"?["摘要与研究问题","相关工作与方法","论证、讨论与局限"]:state.deliverable==="PPT"?["开场：为什么现在要关心","证据转折与关键发现","行动结尾与已知限制"]:["执行摘要与决策背景","关键发现与建议","风险、限制与下一步"]}
    function content(){
      if(state.deliverable==="PPT")return `<div class="storyboard">${shared.sections.map((s,i)=>`<button class="slide" data-section="${s.id}" aria-pressed="${state.selected===s.id}"><small>SLIDE ${i+2} · ${s.label}</small><b>${s.title}</b><span class="citation">${s.sources.length} 个精确来源 ↗</span></button>`).join("")}<button class="slide"><small>SLIDE 05 · 类型特有</small><b>下一步决策</b><span class="muted">结尾行动节奏</span></button></div>`;
      return `<div class="doc">${shared.sections.map(s=>`<button class="doc-block" data-section="${s.id}" aria-pressed="${state.selected===s.id}"><span class="label">${s.label}</span><h2>${s.title}</h2><p>${s.text} <span class="citation">[${s.sources.length} sources]</span></p></button>`).join("")}</div>`
    }
    function inspector(){const s=curSection();return `<aside class="panel pad inspector"><nav>${["来源","修订","版本"].map(x=>`<button data-tab="${x}" aria-pressed="${state.tab===x}">${x}</button>`).join("")}</nav>${state.tab==="来源"?sources(s):state.tab==="修订"?revision(s):versions()}</aside>`}
    function sources(s){return `<div class="eyebrow">当前局部 · ${s.label}</div><h2>${s.title}</h2><dl class="axis"><dt>精确位置</dt><dd class="mono">${locator()}</dd><dt>绑定版本</dt><dd>${shared.version}</dd><dt>输入快照</dt><dd class="mono">r184 · frozen</dd></dl>${sourceCards(s)}<div class="rule"></div><dl class="axis"><dt>RM 内容</dt><dd><span class="chip ok">AssetVersion accepted</span></dd><dt>RG 绑定</dt><dd><span class="chip ok">研究事实只读</span></dd><dt>Writing citation</dt><dd><span class="chip candidate">合同待决</span></dd></dl><div class="notice">研究输入已更新到 r191；当前交付物仍精确绑定 r184。这里展示“陈旧风险”，不自动作正式 stale 裁决。</div>`}
    function revision(s){return `<div class="revision-box"><div class="eyebrow">局部修订 · 精确目标</div><h2>${s.label} / ${s.title}</h2><div class="locked"><b>锁定，不自动漂移</b><br>${locator()}<br>${shared.version} ← ${shared.snapshot}</div><div class="seg" style="margin:12px 0"><button data-revision-mode="deliverable" aria-pressed="${state.revisionMode==="deliverable"}">只改交付物</button><button data-revision-mode="research" aria-pressed="${state.revisionMode==="research"}">可能改变研究事实</button></div><textarea data-revision-text aria-label="修订要求">${esc(state.revisionText)}</textarea><div class="notice ${state.revisionMode==="deliverable"?"safe":""}" style="margin:10px 0">${state.revisionMode==="deliverable"?"会产生新的交付物候选；不会改 Answer、Evidence 或研究事实。":"这不是局部改稿。原型将转为“提出研究变更”，不会直接反转结论。"}</div><button class="primary" ${state.revisionMode==="deliverable"?"data-mock":"data-research-change"}>${state.revisionMode==="deliverable"?"预览局部修订":"提出研究变更"}</button></div>`}
    function versions(){const diffs={"内容":["执行完成即代表交付完成。","执行完成、资产接纳和推进始终分离。"],"证据":["聚合状态，无精确来源边界。","两个精确 Resolution，并将 RM 内容与 RG 研究绑定分轴。"],"Citation":["未验证脚注指向动态 latest。","citation candidate 指向精确位置；正式接纳仍待后续合同。"]},d=diffs[state.compareAxis];return `<div class="eyebrow">版本比较</div><h2>${shared.parent} → ${shared.version}</h2><div class="seg">${["内容","证据","Citation"].map(x=>`<button data-axis="${x}" aria-pressed="${state.compareAxis===x}">${x}</button>`).join("")}</div><div class="compare" style="margin-top:12px"><div><span class="chip">${shared.parent}</span><p><span class="del">${d[0]}</span></p><small class="muted">Snapshot r177</small></div><div><span class="chip ok">${shared.version}</span><p><span class="add">${d[1]}</span></p><small class="muted">Snapshot r184 · 当前查看 ${state.compareAxis} diff</small></div></div><div class="notice" style="margin-top:10px">比较不会把任一版本重定向到 latest；两个版本都保留自己的精确 Snapshot。</div>`}
    function variantA(){return `${header("A · 专业审稿台")}<div class="a-grid"><aside class="panel pad sidebar"><div class="sidebar-head"><div class="eyebrow">语义脊柱</div><h2>读、查、改在同一处</h2></div>${outline()}</aside><main class="panel paper"><div class="paper-head"><div class="eyebrow">${state.deliverable} · ${typeSpecific()[0]}</div><h1>${shared.title}</h1><p>用一个清晰的叙事说明：为什么权威事实必须分离，以及 Writing 如何在不改写研究事实的前提下形成可追溯交付物。</p></div>${content()}</main>${inspector()}</div></div>`}
    function variantB(){const s=curSection();return `${header("B · 谱系地图")}<div class="b-wrap"><aside class="panel pad fact-rail"><div class="eyebrow">只读研究输入</div><h2>RG Snapshot r184</h2><div class="readonly">研究事实区域不可编辑。修改只会在右侧形成新的交付物版本。</div>${shared.sections.map(s=>`<button class="source-card" data-section="${s.id}" aria-pressed="${state.selected===s.id}"><b>${s.label}</b><small>${s.title}</small></button>`).join("")}<div class="rule"></div><span class="chip stale">新 Snapshot r191 可用</span><p class="muted" style="font-size:12px;margin-top:9px">不会静默更新既有分支。</p><button class="secondary danger-lite" data-research-change>提出研究变更</button></aside><main class="panel map"><div class="map-title"><div><div class="eyebrow">跨类型共享候选</div><h1 style="font-size:29px">从同一语义脊柱，长出三种叙事</h1></div><span class="grow"></span><span class="chip candidate">待现场确认</span></div><div class="semantic-spine">${shared.sections.map(s=>`<button class="node" data-section="${s.id}" aria-pressed="${state.selected===s.id}"><b>${s.label}</b><span>${s.title}</span><small class="muted">${s.sources.length} sources</small></button>`).join("")}<button class="node"><b>类型组织</b><span>结构在此分化</span></button><button class="node"><b>读者动作</b><span>理解／决策／讲述</span></button></div><div class="branches">${["Paper","报告","PPT"].map(t=>`<section class="branch"><div class="branch-head"><span class="brand-mark" style="width:28px;height:28px">${t[0]}</span><b>${t}</b></div><button class="version" data-version="${t} W-v3" aria-pressed="${state.B.version===t+' W-v3'}"><b>${t} W-v3</b><small>Snapshot r184 · ${t==="Paper"?"current":t==="报告"?"输入已有更新":"1 项不完整"}</small></button><div class="lineage"><span class="dot"></span><span class="connector"></span><span class="dot"></span><span class="connector"></span><span class="dot"></span></div>${typeSpecificFor(t).map(x=>`<div class="readonly">${x}</div>`).join("")}</section>`).join("")}</div><div class="map-detail"><section><div class="eyebrow">选中语义单元 · ${s.label}</div><h2>${s.title}</h2><p class="muted">${s.text}</p>${sourceCards(s)}</section><section><div class="eyebrow">选中版本</div><h2>${state.B.version}</h2><dl class="axis"><dt>精确位置</dt><dd class="mono">${locator()}</dd><dt>父版本</dt><dd>W-v2</dd><dt>冻结输入</dt><dd class="mono">RG r184</dd><dt>内容</dt><dd>RM AssetVersion accepted</dd></dl><div class="rule"></div><h3>修订只在交付物侧分叉</h3><p class="muted">若质疑底层结论，离开 Writing 分支并提出研究变更；不会拖动或覆盖左侧事实。</p><button class="primary" data-mock>从精确版本创建修订候选</button></section></div></main></div></div>`}
    function typeSpecificFor(t){return t==="Paper"?["学术论证","方法与讨论"]:t==="PPT"?["逐页节奏","讲述转折"]:["决策摘要","建议与风险"]}
    function focusBody(){const step=state.C.step;if(step===1)return `<div class="choice-grid">${["Paper","报告","PPT"].map(t=>`<button class="choice" data-c-type="${t}" aria-pressed="${state.C.type===t}"><b>${t}</b><span>${t==="Paper"?"严谨论证与学术读者":t==="报告"?"清晰结论与决策行动":"逐页叙事与现场讲述"}</span></button>`).join("")}</div>`;if(step===2)return `<div class="notice">以下是需要你判断的候选，而不是既定规范：三类交付物都共享 claim + evidence + limitation，再以不同组织方式服务读者。</div>${shared.sections.map((s,i)=>`<div class="review-item"><span class="count">${i+1}</span><div><b>${s.label} · ${s.title}</b><p class="muted">${s.text}</p></div>${s.status==="incomplete"?'<span class="chip incomplete">不完整</span>':'<span class="chip ok">可追踪</span>'}</div>`).join("")}`;if(step===3)return `${sources(curSection())}<div class="button-row"><button class="secondary" data-section="claim">查看核心主张</button><button class="secondary" data-section="evidence">查看证据链</button><button class="secondary" data-section="limitation">查看限制</button></div>`;if(step===4)return `<div class="locked"><b>精确修订目标</b><br>${locator(state.C.type)}<br>${shared.version} ← ${shared.snapshot}</div><textarea data-c-revision-text aria-label="修订或研究变更要求" style="width:100%;min-height:82px;margin:12px 0;border:1px solid var(--line);border-radius:11px;padding:10px">${esc(state.revisionText)}</textarea><div class="boundary-grid"><button class="boundary" data-boundary="deliverable" aria-pressed="${state.C.boundary==="deliverable"}"><span class="chip ok">Writing 内</span><h2>只改这个交付物</h2><p>产生新的交付物候选，不改变 Answer、Evidence 或研究事实。</p></button><button class="boundary" data-boundary="research" aria-pressed="${state.C.boundary==="research"}"><span class="chip stale">离开 Writing</span><h2>我认为研究事实有误</h2><p>提出研究变更；不允许在文稿里直接把结论改成相反说法。</p></button></div>${state.C.outcome==="research-change-drafted"?'<div class="notice" style="margin-top:12px"><b>已离开 Writing（mock）。</b> 研究变更草案已准备；交付物和研究事实均未改变，版本比较不会继续。</div>':""}`;return `${versions()}<div class="notice safe" style="margin-top:14px">这一步只比较局部修订候选；不代表发布、citation 接纳或正式 Writing 合同已完成。</div>`}
    function variantC(){const labels=["选择类型","确认结构","检查来源","提出修订","比较反馈"],nextLabel=state.C.step===5?"记录 mock 反馈":state.C.step===4?(state.C.boundary==="research"?(state.C.outcome?"已离开 Writing（mock）":"提出研究变更（mock）"):"生成局部修订候选 →"):"继续 →";return `${header("C · 聚焦式验收")}<div class="c-wrap"><div class="receipt">${[["交付物",state.C.type+" "+shared.version],["父版本",shared.parent],["冻结输入","RG r184"],["状态","输入已有更新 / 1 项不完整"]].map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b></div>`).join("")}</div><div class="stepper">${labels.map((x,i)=>`<button class="step" data-step="${i+1}" aria-pressed="${state.C.step===i+1}">${i+1} · ${x}</button>`).join("")}</div><main class="panel focus-card"><div class="focus-head"><span class="focus-num">${state.C.step}</span><div><div class="eyebrow">现场验收任务</div><h1 style="font-size:30px">${labels[state.C.step-1]}</h1><p class="muted">${["先明确读者和叙事用途。","判断共享语义候选是否自然。","找到一条结论的精确支持与边界。","明确改交付物与改研究事实的分界。","比较前后版本并说明你更信任哪个。"] [state.C.step-1]}</p></div></div>${focusBody()}<div class="flow-actions"><button class="secondary" data-prev ${state.C.step===1?"disabled":""}>← 上一步</button><button class="primary" data-next ${state.C.step===4&&state.C.outcome?"disabled":""}>${nextLabel}</button></div></main></div></div>`}
    function render(){state.variant=fromUrl();document.body.dataset.variant=state.variant;document.getElementById("app").innerHTML=state.variant==="A"?variantA():state.variant==="B"?variantB():variantC();bind();chrome();updateState()}
    function fromUrl(){const k=(new URL(location.href).searchParams.get("variant")||"A").toUpperCase();return variants.some(v=>v.key===k)?k:"A"}
    function setVariant(k){const u=new URL(location.href);u.searchParams.set("variant",k);history.replaceState({},"",u);state.variant=k;render()}
    function cycle(d){const i=variants.findIndex(v=>v.key===state.variant);setVariant(variants[(i+d+variants.length)%variants.length].key)}
    function bind(){
      document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{state.deliverable=b.dataset.type;if(state.variant==="B")state.B.version=b.dataset.type+" W-v3";if(state.variant==="C")state.C.type=b.dataset.type;render()});
      document.querySelectorAll("[data-section]").forEach(b=>b.onclick=()=>{state.selected=b.dataset.section;render()});
      document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
      document.querySelectorAll("[data-axis]").forEach(b=>b.onclick=()=>{state.compareAxis=b.dataset.axis;render()});
      document.querySelectorAll("[data-revision-mode]").forEach(b=>b.onclick=()=>{state.revisionMode=b.dataset.revisionMode;render()});
      const ta=document.querySelector("[data-revision-text]");if(ta)ta.oninput=e=>{state.revisionText=e.target.value;updateState()};
      document.querySelectorAll("[data-version]").forEach(b=>b.onclick=()=>{state.B.version=b.dataset.version;state.deliverable=b.dataset.version.replace(" W-v3","");render()});
      document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{const next=Number(b.dataset.step);if(state.C.outcome==="research-change-drafted"&&next===5){toast("已离开 Writing；研究变更不能进入交付物版本比较。");return}state.C.step=next;if(next!==4)state.C.outcome=null;render()});
      document.querySelectorAll("[data-c-type]").forEach(b=>b.onclick=()=>{state.C.type=b.dataset.cType;state.deliverable=b.dataset.cType;render()});
      document.querySelectorAll("[data-boundary]").forEach(b=>b.onclick=()=>{state.C.boundary=b.dataset.boundary;state.C.outcome=null;render()});
      const cta=document.querySelector("[data-c-revision-text]");if(cta)cta.oninput=e=>{state.revisionText=e.target.value;updateState()};
      document.querySelectorAll("[data-prev]").forEach(b=>b.onclick=()=>{state.C.step=Math.max(1,state.C.step-1);state.C.outcome=null;render()});
      document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>{if(state.C.step===4){if(state.C.boundary==="research"){state.C.outcome="research-change-drafted";state.lastMockAction="left Writing; research-change draft prepared; facts unchanged";render()}else{state.C.outcome="deliverable-candidate";state.lastMockAction="local deliverable candidate from W-v3 + r184";state.C.step=5;render()}return}if(state.C.step<5){state.C.step++;render()}else{state.lastMockAction="HITL feedback recorded in browser memory";updateState();toast("反馈只保存在浏览器内存；GitHub 与核心系统写入均为 0。")}});
      document.querySelectorAll("[data-mock]").forEach(b=>b.onclick=()=>{state.lastMockAction="deliverable candidate preview; facts unchanged";updateState();toast("已生成 mock 候选；未写入研究事实、资产或 GitHub。");});
      document.querySelectorAll("[data-research-change]").forEach(b=>b.onclick=()=>{state.lastMockAction="left Writing; research-change draft prepared; facts unchanged";updateState();toast("已离开 Writing 修订路径（mock）；研究事实没有改变。");});
    }
    function chrome(){document.querySelectorAll(".switcher,.state").forEach(x=>x.remove());const v=variants.find(x=>x.key===state.variant);const nav=document.createElement("nav");nav.className="switcher";nav.setAttribute("aria-label","Prototype 方案切换");nav.innerHTML=`<button data-cycle="-1" aria-label="上一个方案">←</button><div><b>${v.key}</b> — ${v.name}</div><button data-cycle="1" aria-label="下一个方案">→</button>`;nav.querySelectorAll("button").forEach(b=>b.onclick=()=>cycle(Number(b.dataset.cycle)));document.body.appendChild(nav);const det=document.createElement("details");det.className="state";det.innerHTML='<summary>FULL RELEVANT PROTOTYPE STATE</summary><pre id="state-json"></pre>';document.body.appendChild(det)}
    function updateState(){const el=document.getElementById("state-json");if(el)el.textContent=JSON.stringify({...state,selectedSection:curSection().label,localTarget:locator(),lockedBinding:{deliverableVersion:shared.version,inputSnapshot:shared.snapshot},authorityBoundary:"修改交付物不等于改变研究事实"},null,2)}
    function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
    addEventListener("popstate",render);addEventListener("keydown",e=>{const t=e.target;const editing=t&&(t.matches?.("input,textarea,select")||t.isContentEditable);if(editing)return;if(e.key==="ArrowLeft"){e.preventDefault();cycle(-1)}if(e.key==="ArrowRight"){e.preventDefault();cycle(1)}});render();
  }());
  </script>
</body>
</html>
