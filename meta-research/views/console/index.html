<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>meta-research 人类控制台 · 原型</title>
<style>
:root{
  --bg:#F4F6F5; --panel:#FFFFFF; --panel2:#FAFBFA; --ink:#1B2422; --sub:#5A6963;
  --line:#DCE3E0; --line2:#EBEFED;
  --accent:#0B6B5D; --accent-ink:#0A5A4E; --accent-bg:#E3F0ED; --accent-bg2:#F0F7F5;
  --ok:#276B45; --ok-bg:#E4F1E8;
  --bad:#A93A2F; --bad-bg:#F6E6E2;
  --warn:#8A6400; --warn-bg:#F5EDD6;
  --human:#5B4A9E; --human-bg:#EAE6F5;
  --dead:#6B7370; --dead-bg:#ECEEEC;
  --mono:ui-monospace,"SFMono-Regular","JetBrains Mono","Cascadia Code",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:13.5px; line-height:1.65;
  display:grid; grid-template-columns:240px minmax(0,1fr) 340px; grid-template-rows:52px minmax(0,1fr);
  height:100vh; overflow:hidden;
}
@media (max-width:1180px){ body{grid-template-columns:0 minmax(0,1fr) 300px} .fstree{display:none} }
.mono{font-family:var(--mono); font-size:.92em}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent-ink)}
button{font-family:var(--sans)}

/* ---------- 顶栏 ---------- */
.topbar{
  grid-column:1/4; display:flex; align-items:center; gap:14px; padding:0 16px;
  background:var(--panel); border-bottom:1px solid var(--line); z-index:5;
}
.brand{display:flex; align-items:baseline; gap:8px; white-space:nowrap}
.brand b{font-size:14.5px; letter-spacing:.02em}
.brand .mono{color:var(--sub); font-size:11px}
.sim-tag{
  font-size:11px; padding:2px 8px; border-radius:3px; white-space:nowrap;
  background:var(--warn-bg); color:var(--warn); border:1px solid #E5D9AE; font-weight:600;
}
.topbar .spacer{flex:1}
.topstat{display:flex; align-items:center; gap:8px; white-space:nowrap; flex-wrap:nowrap}
.tchip{
  display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border:1px solid var(--line);
  border-radius:4px; background:var(--panel2); font-size:12px; color:var(--sub);
}
.tchip b{color:var(--ink); font-weight:600}
.scen{display:inline-flex; border:1px solid var(--line); border-radius:4px; overflow:hidden}
.scen button{
  border:0; background:var(--panel); color:var(--sub); font-size:11.5px; padding:4px 9px; cursor:pointer;
  border-left:1px solid var(--line);
}
.scen button:first-child{border-left:0}
.scen button.on{background:var(--accent); color:#fff}
.scen button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}

/* ---------- 左侧导航 ---------- */
.nav{
  background:var(--panel); border-right:1px solid var(--line); padding:12px 10px; overflow-y:auto;
  display:flex; flex-direction:column; gap:2px;
}
.nav .grp{font-size:10.5px; letter-spacing:.14em; color:var(--sub); margin:12px 8px 4px; text-transform:uppercase}
.nav .grp:first-child{margin-top:2px}
.navbtn{
  display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%;
  border:0; background:transparent; text-align:left; padding:7px 10px; border-radius:5px;
  font-size:13px; color:var(--ink); cursor:pointer;
}
.navbtn .en{font-family:var(--mono); font-size:10px; color:var(--sub)}
.navbtn:hover{background:var(--panel2)}
.navbtn.on{background:var(--accent-bg); color:var(--accent-ink); font-weight:600}
.navbtn.on .en{color:var(--accent-ink)}
.navbtn:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.navfoot{margin-top:auto; padding:10px 8px 4px; font-size:10.5px; color:var(--sub); line-height:1.5; border-top:1px dashed var(--line)}

/* ---------- 主区 ---------- */
.main{overflow-y:auto; padding:18px 22px 60px; scroll-behavior:smooth}
.page{max-width:1280px; margin:0 auto}
.pagehead{display:flex; align-items:baseline; gap:12px; margin:2px 0 4px}
.pagehead h1{font-size:17px; margin:0; letter-spacing:.01em}
.pagehead .en{font-family:var(--mono); font-size:11px; color:var(--sub)}
.pagesub{color:var(--sub); font-size:12.5px; margin:0 0 14px; max-width:72em}
.pagesub .mono{font-size:11px}
.docref{
  margin-top:26px; padding-top:10px; border-top:1px dashed var(--line);
  font-size:11px; color:var(--sub); line-height:1.7;
}
.docref b{color:var(--sub)}

/* ---------- 卡片与栅格 ---------- */
.card{background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:14px 16px; min-width:0}
.card.pad0{padding:0; overflow:hidden}
.card h3{margin:0 0 10px; font-size:13.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.card h3 .en{font-family:var(--mono); font-size:10px; color:var(--sub); font-weight:400}
.eyebrow{font-size:10.5px; letter-spacing:.13em; color:var(--sub); text-transform:uppercase; font-family:var(--mono)}
.grid{display:grid; gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media (max-width:1080px){.g2,.g3,.g21,.g12{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex; flex-direction:column; gap:12px}

/* ---------- 芯片 / 状态 ---------- */
.chip{
  display:inline-flex; align-items:center; gap:4px; padding:1px 7px; border-radius:3px;
  font-size:11px; font-weight:600; border:1px solid transparent; white-space:nowrap; vertical-align:middle;
}
.chip .mono{font-weight:500}
.c-ok{background:var(--ok-bg); color:var(--ok); border-color:#CBE3D2}
.c-bad{background:var(--bad-bg); color:var(--bad); border-color:#EBCFC8}
.c-warn{background:var(--warn-bg); color:var(--warn); border-color:#E5D9AE}
.c-human{background:var(--human-bg); color:var(--human); border-color:#D6CEEC}
.c-dead{background:var(--dead-bg); color:var(--dead); border-color:#D8DCDA}
.c-acc{background:var(--accent-bg); color:var(--accent-ink); border-color:#C5DED8}
.c-line{background:var(--panel); color:var(--sub); border-color:var(--line)}
.c-ink{background:#EDF0EF; color:var(--ink); border-color:var(--line)}
.dot{width:7px; height:7px; border-radius:50%; display:inline-block; flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
.dot.acc{background:var(--accent)} .dot.dead{background:var(--dead)} .dot.human{background:var(--human)}
.dot.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot.pulse{animation:none}}

/* applicability 徽标(§4.5.1:单行、六枚举全渲染) */
.appb{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:1px 7px;
  border-radius:3px; border:1px dashed; font-family:var(--mono); white-space:nowrap;
}
.appb.still{color:var(--ok); border-color:#9CC7AB; background:var(--ok-bg)}
.appb.pending{color:var(--warn); border-color:#D3BE79; background:var(--warn-bg)}
.appb.blocked{color:var(--dead); border-color:#B9BFBC; background:var(--dead-bg)}
.appb.needs{color:var(--warn); border-color:#D3BE79; background:var(--warn-bg)}
.appb.contradicted{color:var(--bad); border-color:#D9A49B; background:var(--bad-bg)}
.appb.obsolete{color:var(--dead); border-color:#B9BFBC; background:var(--dead-bg)}

/* ---------- 键值 / 表格 ---------- */
.kv{display:grid; grid-template-columns:auto 1fr; gap:3px 14px; font-size:12.5px}
.kv dt{color:var(--sub); white-space:nowrap}
.kv dd{margin:0; min-width:0}
table.t{width:100%; border-collapse:collapse; font-size:12.5px}
table.t th{
  text-align:left; font-size:10.5px; letter-spacing:.08em; color:var(--sub); font-weight:600;
  padding:7px 10px; border-bottom:1px solid var(--line); background:var(--panel2); white-space:nowrap;
  font-family:var(--mono);
}
table.t td{padding:7px 10px; border-bottom:1px solid var(--line2); vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.rowbtn{cursor:pointer}
table.t tr.rowbtn:hover td{background:var(--accent-bg2)}
table.t tr.rowsel td{background:var(--accent-bg2); box-shadow:inset 2px 0 0 var(--accent)}
.tw{overflow-x:auto}
.right{text-align:right}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:5px; font-size:12.5px;
  border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; font-weight:600;
}
.btn:hover{background:var(--accent-ink)}
.btn.ghost{background:var(--panel); color:var(--accent-ink)}
.btn.ghost:hover{background:var(--accent-bg)}
.btn.gray{background:var(--panel); color:var(--sub); border-color:var(--line)}
.btn.gray:hover{background:var(--panel2)}
.btn.danger{background:var(--panel); color:var(--bad); border-color:#D9A49B}
.btn.danger:hover{background:var(--bad-bg)}
.btn:focus-visible{outline:2px solid var(--ink); outline-offset:1px}
.btn[disabled]{opacity:.45; cursor:not-allowed}

/* ---------- 总览:快照 vs 执行 双层带 ---------- */
.duo{display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:12px}
@media (max-width:1080px){.duo{grid-template-columns:minmax(0,1fr)}}
.snapcard{border:1px solid var(--line); border-radius:7px; background:var(--panel); overflow:hidden}
.snapcard>.hd{
  display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line);
  background:var(--panel2);
}
.snapcard>.hd .ttl{font-weight:700; font-size:12.5px}
.snapcard>.hd .en{font-family:var(--mono); font-size:10px; color:var(--sub)}
.snapcard>.bd{padding:13px 16px}
.livecard{border:1px solid #BFD9D3; border-radius:7px; background:var(--accent-bg2); overflow:hidden}
.livecard>.hd{
  display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid #BFD9D3;
  background:var(--accent-bg); color:var(--accent-ink);
}
.livecard>.hd .ttl{font-weight:700; font-size:12.5px}
.livecard>.hd .en{font-family:var(--mono); font-size:10px}
.livecard>.bd{padding:13px 16px}
.stripgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px 16px; font-size:12.5px}
.stripgrid .lbl{color:var(--sub); font-size:11px; display:block}
.stripgrid .val{font-weight:600}
.qcard{
  border:1px solid var(--line); border-left:3px solid var(--accent); background:var(--panel2);
  border-radius:5px; padding:9px 12px; font-size:12.5px; margin-top:8px;
}
.qcard .qid{font-family:var(--mono); font-size:11px; color:var(--accent-ink); font-weight:700}
.meter{height:7px; border-radius:4px; background:var(--line2); overflow:hidden; margin-top:4px}
.meter>i{display:block; height:100%; background:var(--accent); border-radius:4px}
.meter>i.warn{background:var(--warn)}

/* ---------- 问题树 ---------- */
.tree{font-size:13px}
.tnode{margin:0; padding:0}
.trow{
  display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:5px; cursor:pointer;
  border:1px solid transparent; min-width:0;
}
.trow:hover{background:var(--panel2)}
.trow.sel{background:var(--accent-bg2); border-color:#C5DED8}
.trow .tog{
  width:16px; height:16px; flex:none; display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--line); border-radius:3px; background:var(--panel); font-size:10px; color:var(--sub);
  cursor:pointer; font-family:var(--mono);
}
.trow .tog.leaf{visibility:hidden}
.trow .qid{font-family:var(--mono); font-size:11px; color:var(--sub); flex:none; width:32px}
.trow .txt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.trow .txt.closed{color:var(--sub)}
.trow .meta{margin-left:auto; display:flex; gap:5px; flex:none; align-items:center}
.tchildren{margin-left:22px; border-left:1px solid var(--line2); padding-left:6px}
.human-mark{box-shadow:inset 3px 0 0 var(--human); background:linear-gradient(90deg,var(--human-bg),transparent 45%)}

/* ---------- 时间线 / 流水 ---------- */
.tl{list-style:none; margin:0; padding:0}
.tl li{display:flex; gap:10px; padding:7px 2px; border-bottom:1px solid var(--line2); font-size:12.5px}
.tl li:last-child{border-bottom:0}
.tl .when{font-family:var(--mono); font-size:11px; color:var(--sub); flex:none; width:118px}
.tl .who{flex:none; width:86px}
.tl .what{min-width:0}

/* ---------- 四阶段 stepper ---------- */
.stepper{display:flex; align-items:center; gap:0; margin:6px 0 2px; flex-wrap:wrap}
.step{display:flex; align-items:center; gap:7px; padding:5px 12px; border:1px solid var(--line); background:var(--panel);
  font-family:var(--mono); font-size:11.5px; color:var(--sub)}
.step:first-child{border-radius:5px 0 0 5px}
.step:last-child{border-radius:0 5px 5px 0}
.step+.step{border-left:0}
.step.done{background:var(--ok-bg); color:var(--ok)}
.step.now{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700}
.step.todo{background:var(--panel2)}
.step.fail{background:var(--bad-bg); color:var(--bad)}

/* ---------- 对话 ---------- */
.chatwrap{display:flex; flex-direction:column; height:calc(100vh - 210px); min-height:420px}
.chatlog{flex:1; overflow-y:auto; padding:6px 4px 12px; display:flex; flex-direction:column; gap:10px}
.msg{max-width:76%; display:flex; flex-direction:column; gap:4px}
.msg.in{align-self:flex-end; align-items:flex-end}
.msg.out{align-self:flex-start; align-items:flex-start}
.bubble{padding:8px 12px; border-radius:9px; font-size:13px; line-height:1.6; border:1px solid var(--line); background:var(--panel)}
.msg.in .bubble{background:var(--accent); border-color:var(--accent); color:#fff; border-bottom-right-radius:3px}
.msg.out .bubble{border-bottom-left-radius:3px}
.msg .meta{font-size:10.5px; color:var(--sub); display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.msg .meta .mono{font-size:10px}
.sysline{align-self:center; font-size:11px; color:var(--sub); background:var(--panel2); border:1px dashed var(--line);
  padding:2px 10px; border-radius:10px; max-width:88%; text-align:center}
.polish{
  border:1px dashed #C5DED8; background:var(--accent-bg2); border-radius:6px; padding:7px 10px;
  font-size:12px; margin-top:5px;
}
.polish .lbl{font-size:10px; color:var(--accent-ink); font-family:var(--mono); letter-spacing:.08em}
.chatinput{display:flex; gap:8px; padding-top:10px; border-top:1px solid var(--line)}
.chatinput input{
  flex:1; border:1px solid var(--line); border-radius:5px; padding:8px 12px; font-size:13px; font-family:var(--sans);
  background:var(--panel); color:var(--ink);
}
.chatinput input:focus-visible{outline:2px solid var(--accent); outline-offset:-1px}

/* ---------- 台账条形 ---------- */
.bars{display:flex; align-items:flex-end; gap:5px; height:110px; padding:6px 2px 0}
.bar{flex:1; min-width:10px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer}
.bar>i{width:100%; background:#B8D4CD; border-radius:2px 2px 0 0; display:block; min-height:2px}
.bar.cur>i{background:var(--accent)}
.bar.fail>i{background:#D9A49B}
.bar>span{font-size:9.5px; font-family:var(--mono); color:var(--sub)}
.bar:hover>i{filter:brightness(.88)}

/* ---------- 杂项 ---------- */
.callout{
  border:1px solid #C5DED8; background:var(--accent-bg2); border-radius:7px; padding:10px 14px; font-size:12.5px;
}
.callout.warn{border-color:#E5D9AE; background:#FCF8EC}
.callout.bad{border-color:#EBCFC8; background:#FBF1EF}
.lognote{
  display:inline-block; font-size:10px; font-family:var(--mono); letter-spacing:.1em; color:var(--warn);
  border:1px solid #E5D9AE; background:var(--warn-bg); border-radius:3px; padding:0 6px; margin-left:8px;
}
.rawlog{
  background:#202724; color:#C9D4CF; font-family:var(--mono); font-size:11.5px; line-height:1.75;
  border-radius:6px; padding:12px 14px; overflow-x:auto; white-space:pre;
}
.rawlog .nan{color:#F0A599; font-weight:700}
.rawlog .dim{color:#7C8883}
.hash{color:var(--sub); font-family:var(--mono); font-size:10.5px}
.divider{border:0; border-top:1px dashed var(--line); margin:14px 0}
.small{font-size:11.5px; color:var(--sub)}
.toast{
  position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff; padding:10px 16px; border-radius:6px;
  font-size:12.5px; box-shadow:0 6px 20px rgba(0,0,0,.25); z-index:50; max-width:420px;
}
.legend{display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:11px; color:var(--sub)}
.statebox{border:1px solid var(--line); border-radius:6px; background:var(--panel2); padding:9px 12px; font-size:12px}
.arrowflow{font-family:var(--mono); font-size:11.5px; color:var(--sub); line-height:2.1; overflow-x:auto; white-space:nowrap}
.arrowflow b{color:var(--ink)}
.gatechip{display:inline-block; font-family:var(--mono); font-size:10.5px; border:1px solid var(--line); background:var(--panel);
  border-radius:3px; padding:0 6px; color:var(--accent-ink)}

/* ==================== v2 外壳:三列持久区 ==================== */
.fstree{grid-column:1; grid-row:2; overflow-y:auto; background:var(--panel); border-right:1px solid var(--line); padding:10px 8px 24px; font-size:12px}
.fstitle{font-size:10px; letter-spacing:.12em; color:var(--sub); font-family:var(--mono); margin:2px 6px 8px; text-transform:uppercase}
.fsrow{display:flex; align-items:center; gap:5px; padding:3px 6px; border-radius:4px; cursor:pointer; white-space:nowrap; color:var(--ink)}
.fsrow:hover{background:var(--panel2)}
.fsrow.on{background:var(--accent-bg2); color:var(--accent-ink)}
.fsrow .fscaret{width:13px; flex:none; font-family:var(--mono); font-size:9.5px; color:var(--sub); text-align:center}
.fsrow .fsname{overflow:hidden; text-overflow:ellipsis; font-family:var(--mono); font-size:11.5px}
.fsrow.dir>.fsname{font-weight:700}
.fsrow .fslive{width:6px; height:6px; border-radius:50%; background:var(--accent); margin-left:auto; flex:none; animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.fsrow .fslive{animation:none}}
.fskids{margin-left:12px; border-left:1px solid var(--line2); padding-left:4px}
.fsnote{margin:12px 6px 0; padding-top:8px; border-top:1px dashed var(--line); font-size:10.5px; color:var(--sub); line-height:1.6}

.centercol{grid-column:2; grid-row:2; display:grid; grid-template-rows:38px minmax(0,1fr) auto; min-width:0; min-height:0}
.stagetabs{display:flex; align-items:stretch; gap:2px; padding:0 10px; background:var(--panel); border-bottom:1px solid var(--line); overflow-x:auto}
.stagetabs button{border:0; background:transparent; cursor:pointer; font-size:12.5px; color:var(--sub); padding:0 11px;
  border-bottom:2px solid transparent; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; font-family:var(--sans)}
.stagetabs button .en{font-family:var(--mono); font-size:9px; color:var(--sub)}
.stagetabs button:hover{color:var(--ink); background:var(--panel2)}
.stagetabs button.on{color:var(--accent-ink); border-bottom-color:var(--accent); font-weight:700}
.stagetabs button.main-tab{font-size:13px}
.stagetabs button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}

.stage{position:relative; overflow:hidden; min-height:0; background:var(--bg)}
#stage-page{height:100%; overflow-y:auto}
#stage-page>.page{max-width:1160px; margin:0 auto; padding:16px 20px 48px}
#preview{position:absolute; inset:0; z-index:8; background:var(--panel); display:flex; flex-direction:column}
#preview:empty{display:none}
.pvhead{display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line); background:var(--panel2)}
.pvhead .path{font-family:var(--mono); font-size:12px; color:var(--accent-ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pvbody{flex:1; overflow:auto; padding:14px 16px}
.pvnote{padding:8px 16px; border-top:1px dashed var(--line); font-size:11px; color:var(--sub)}

/* ---------- dock:持续输出记录 ---------- */

.dockfold{margin-left:auto; border:1px solid var(--line); background:var(--panel); border-radius:3px; cursor:pointer; font-size:11px; color:var(--sub); padding:1px 8px}
.stream{overflow-y:auto; padding:4px 10px; font-size:11.5px; line-height:1.5; background:var(--panel)}
.sline{display:flex; gap:8px; padding:2.5px 8px; border-left:3px solid var(--line); margin:2px 0; border-radius:0 3px 3px 0; background:var(--panel2)}
.sline .st{font-family:var(--mono); font-size:10px; color:var(--sub); flex:none; width:78px; padding-top:1px}
.sline .sk{font-family:var(--mono); font-size:9.5px; flex:none; width:62px; color:var(--sub); padding-top:1px}
.sline .sx{min-width:0; word-break:break-word}
.k-advance{border-left-color:#9DB3AC}
.k-gate{border-left-color:var(--ink)}
.k-notify{border-left-color:var(--warn)}
.k-runner{border-left-color:#7C8883}
.k-heartbeat{border-left-color:#C4CFCA}
.k-directive{border-left-color:var(--human)}
.k-cmd{border-left-color:var(--accent); background:var(--accent-bg2)}
.k-reply{border-left-color:var(--accent)}
.cmdline{display:flex; gap:8px; align-items:center; padding:6px 10px; border-top:1px solid var(--line2); background:var(--panel)}
.cmdline .prompt{color:var(--accent-ink); font-weight:700; font-family:var(--mono)}
.cmdline input{flex:1; border:1px solid var(--line); border-radius:5px; padding:6px 10px; font-size:12.5px; font-family:var(--sans); background:var(--panel); color:var(--ink); min-width:0}

const HEADLESS = (typeof window === "undefined");   // node stub 冒烟环境
const CAPABILITY_STORAGE_KEY = "meta_research_console_capability";
const IDEMPOTENCY_STORAGE_KEY = "meta_research_console_pending_posts_v1";
const CONVERSATION_STORAGE_KEY = "meta_research_console_conversation_v1";
const API_TIMEOUT_MS = 10000;
const SNAPSHOT_MAX_AGE_MS = 10000;
const DEMO_MODE = !HEADLESS && new URLSearchParams(window.location.search||"").get("demo")==="1";
let _consoleCapability = null;
let _capabilityErrorShown = false;
let _consoleReady = DEMO_MODE;
let _lastDbSuccessAt = null;

function _clearCapabilityFragment(){
  if(HEADLESS) return true;
  if(!window.location || !window.history) return false;
  if(!window.location.hash) return true;
  try{
    window.history.replaceState(null, document.title, window.location.pathname+window.location.search);
    return true;
  }catch(e){ return false; }                                   // 不能从地址栏清掉 capability 时拒绝使用它
}
function bootstrapConsoleCapability(){
  if(HEADLESS) return null;
  let fragmentToken=null, fragmentPresent=false;
  try{
    const raw=(window.location.hash||"").replace(/^#/,"");
    const params=new URLSearchParams(raw);
    const values=params.getAll("token"); fragmentPresent=values.length>0;
    if(values.length===1 && /^[0-9a-f]{64}$/.test(values[0])) fragmentToken=values[0];
    if(!_clearCapabilityFragment()) fragmentToken=null;      // fragment 不发送给 server；读取后也不留在地址栏/历史项
    if(fragmentToken) window.sessionStorage.setItem(CAPABILITY_STORAGE_KEY, fragmentToken);
    else if(fragmentPresent) window.sessionStorage.removeItem(CAPABILITY_STORAGE_KEY);
    const stored=fragmentToken||window.sessionStorage.getItem(CAPABILITY_STORAGE_KEY);
    if(stored && /^[0-9a-f]{64}$/.test(stored)) _consoleCapability=stored;
    else { window.sessionStorage.removeItem(CAPABILITY_STORAGE_KEY); _consoleCapability=null; }
  }catch(e){
    _clearCapabilityFragment(); _consoleCapability=null;            // storage 不可用则 fail closed，不另造隐式持久/内存通道
  }
  return _consoleCapability;
}
function clearConsoleCapability(){
  _consoleCapability=null;
  if(!HEADLESS){ try{ window.sessionStorage.removeItem(CAPABILITY_STORAGE_KEY); }catch(e){} }
}
function showCapabilityError(){
  if(_capabilityErrorShown || HEADLESS) return;
  _capabilityErrorShown=true;
  const msg="控制台 API 需要 capability；请用 server 提供的 #token=… 地址重新打开本页。";
  showConnectionGuard(msg);
  toast(msg);
  emitEvent({k:"notify", text:msg});
}
function showConnectionGuard(message){
  if(HEADLESS || DEMO_MODE) return;
  _consoleReady=false;
  let guard=document.getElementById("console-connection-guard");
  if(!guard){
    guard=document.createElement("div"); guard.id="console-connection-guard";
    guard.style.cssText="position:fixed;inset:0;z-index:99999;background:rgba(12,16,22,.96);color:#f4f7fb;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;font:600 16px/1.7 system-ui;white-space:pre-wrap";
    document.body.appendChild(guard);
  }
  const age=_lastDbSuccessAt==null?"尚未取得真实快照":("上次真实快照距今 "+Math.max(0,Math.round((Date.now()-_lastDbSuccessAt)/1000))+" 秒");
  guard.textContent=message+"\n"+age+"\n控制动作已禁用；不会显示或操作内嵌演示状态。";
  guard.style.display="flex";
}
function clearConnectionGuard(){
  if(HEADLESS || DEMO_MODE) return;
  const guard=document.getElementById("console-connection-guard"); if(guard) guard.style.display="none";
  _consoleReady=true;
}
function snapshotIsFresh(){
  return _lastDbSuccessAt!=null && (Date.now()-_lastDbSuccessAt)<=SNAPSHOT_MAX_AGE_MS;
}
function markConsoleSnapshotFresh(){
  _lastDbSuccessAt=Date.now(); clearConnectionGuard();

async function apiFetch(url, options){
  if(typeof url!=="string" || !/^\/api(?:[/?]|$)/.test(url)) throw new Error("apiFetch 只允许同源 /api 路径");
  if(!_consoleCapability){ showCapabilityError(); throw new Error("console capability required"); }
  const opts=Object.assign({}, options||{}), headers=new Headers(opts.headers||{});
  if(headers.has("Authorization")) throw new Error("Authorization 由 apiFetch 管理");
  if(opts.signal) throw new Error("AbortSignal 由 apiFetch 管理");
  headers.set("Authorization", "Bearer "+_consoleCapability);
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),API_TIMEOUT_MS);
  let response;
  try{
    response=await fetch(url, Object.assign(opts, {
      headers:headers, signal:controller.signal, credentials:"omit", redirect:"error",
      referrerPolicy:"no-referrer", cache:"no-store"
    }));
  }catch(e){
    showConnectionGuard("控制台 API 网络错误："+(e&&e.message?e.message:String(e)));
    throw e;
  }finally{ clearTimeout(timeout); }
  if(response.status===401){ clearConsoleCapability(); showCapabilityError(); }
  else if(response.status>=500) showConnectionGuard("控制台 API 返回 HTTP "+response.status+"。");
  return response;
}
function _pendingPostMap(){
  let value;
  try{ value=JSON.parse(window.sessionStorage.getItem(IDEMPOTENCY_STORAGE_KEY)||"{}"); }
  catch(e){ value={}; }
  if(!value || typeof value!=="object" || Array.isArray(value)) return {};
  const valid={};
  Object.entries(value).forEach(([operation,key])=>{
    try{
      const parsed=JSON.parse(operation);
      if(Array.isArray(parsed)&&parsed.length===2&&typeof parsed[0]==="string"&&/^\/api(?:[/?]|$)/.test(parsed[0])
          && /^[0-9a-f]{32}$/.test(key||"")) valid[operation]=key;
    }catch(e){}
  });
  return valid;
}
function _newIdempotencyKey(){
  if(HEADLESS || !window.crypto || !window.crypto.getRandomValues) throw new Error("浏览器缺少安全随机源");
  const bytes=new Uint8Array(16); window.crypto.getRandomValues(bytes);
  return Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("");
}
function _conversationId(){
  let value="";
  try{ value=window.sessionStorage.getItem(CONVERSATION_STORAGE_KEY)||""; }catch(e){}
  if(!/^[0-9a-f]{32}$/.test(value)){
    value=_newIdempotencyKey();
    window.sessionStorage.setItem(CONVERSATION_STORAGE_KEY,value);
  }
  if(window.sessionStorage.getItem(CONVERSATION_STORAGE_KEY)!==value)
    throw new Error("conversation_id 未能持久化");
  return value;
}
function _postOperationKey(url,payload){
  if(typeof url!=="string" || !/^\/api(?:[/?]|$)/.test(url)) throw new Error("apiPost 只允许同源 /api 路径");
  return JSON.stringify([url,payload]);
}
function _idempotencyKeyFor(url,payload){
  const operation=_postOperationKey(url,payload), pending=_pendingPostMap();
  let key=pending[operation];
  if(!key){
    if(Object.keys(pending).length>=64){
      window.sessionStorage.setItem(IDEMPOTENCY_STORAGE_KEY,JSON.stringify(pending)); // 先清理格式非法项，但绝不淘汰未决请求
      throw new Error("未决控制请求已达 64 条；请先确认或恢复连接");
    }
    key=_newIdempotencyKey();
  }
  pending[operation]=key;
  window.sessionStorage.setItem(IDEMPOTENCY_STORAGE_KEY,JSON.stringify(pending));
  if(_pendingPostMap()[operation]!==key) throw new Error("Idempotency-Key 未能持久化");
  return {operation,key};
}
function _clearPostKey(operation,key){
  try{
    const pending=_pendingPostMap();
    if(pending[operation]===key){ delete pending[operation]; window.sessionStorage.setItem(IDEMPOTENCY_STORAGE_KEY,JSON.stringify(pending)); }
  }catch(e){}
}
async function apiPost(url,payload){
  if(DEMO_MODE) throw new Error("demo 模式不发送控制请求");
  if(!_consoleReady || !snapshotIsFresh()){
    showConnectionGuard("真实状态快照已过期，拒绝发送控制请求。");
    throw new Error("fresh console snapshot required");
  }
  const pending=_idempotencyKeyFor(url,payload);
  const response=await apiFetch(url,{method:"POST",headers:{"Content-Type":"application/json","Idempotency-Key":pending.key},body:JSON.stringify(payload)});
  let body=null; try{ body=await response.json(); }catch(e){}
  const echoed=body&&body.queued&&body.queued.idempotency_key;
  if((response.ok&&echoed==="console-"+pending.key)||(response.status>=400&&response.status<500))
    _clearPostKey(pending.operation,pending.key);                // network/5xx may follow durable append: retain key
  return {response,body};
}

/* ============ 问题树画布(主视图;手写 pan/zoom,零依赖) ============ */
const CV = { NODE_W:210, NODE_H:64, COL_GAP:72, ROW_GAP:18, PAD:40,
             K_MIN:0.25, K_MAX:2.5, ZOOM_SPEED:0.0012, FIT_MARGIN:0.94,
             CLICK_SLOP:4, MINI_W:146, MINI_H:94 };
const COL_PITCH = CV.NODE_W + CV.COL_GAP;
const ROW_PITCH = CV.NODE_H + CV.ROW_GAP;
let CVL = null;   // 最近一次布局(树数据静态,布局可缓存)

function treeLayout(){
  const qs = DB.question.slice().sort((a,b)=>a.id-b.id);
  const kids = {};
  qs.forEach(x=>{ const p = x.parent_id==null ? 0 : x.parent_id; (kids[p]=kids[p]||[]).push(x); });
  const pos = {}; let cursor = 0;
  function assign(n, depth){
    const ch = kids[n.id] || [];
    if(!ch.length){ pos[n.id] = { row:cursor++, depth }; return; }
    ch.forEach(c=>assign(c, depth+1));
    pos[n.id] = { row:(pos[ch[0].id].row + pos[ch[ch.length-1].id].row)/2, depth };
  }
  (kids[0]||[]).forEach(r=>assign(r,0));
  let maxDepth = 0;
  const nodes = qs.filter(x=>pos[x.id]).map(x=>{
    const p = pos[x.id]; maxDepth = Math.max(maxDepth, p.depth);
    return { q:x, x:CV.PAD + p.depth*COL_PITCH, y:CV.PAD + p.row*ROW_PITCH, depth:p.depth };
  });
  const W = CV.PAD*2 + (maxDepth+1)*COL_PITCH - CV.COL_GAP;
  const H = CV.PAD*2 + cursor*ROW_PITCH - CV.ROW_GAP;
  const byId = {}; nodes.forEach(n=>byId[n.q.id]=n);
  const edges = [];
  qs.forEach(x=>{ if(x.parent_id!=null && byId[x.parent_id] && byId[x.id]) edges.push({a:byId[x.parent_id], b:byId[x.id], kind:"tree"}); });
  DB.question_dep.forEach(d=>{
    if(d.dep_type==="question" && byId[d.depends_on_question_id] && byId[d.question_id])
      edges.push({a:byId[d.depends_on_question_id], b:byId[d.question_id], kind:"dep", status:d.status});
  });
  return { nodes, edges, W, H, byId };
}
function edgePath(e){
  const x1=e.a.x+CV.NODE_W, y1=e.a.y+CV.NODE_H/2, x2=e.b.x, y2=e.b.y+CV.NODE_H/2;
  const dx=Math.min(90, Math.max(24, Math.abs(x2-x1)/2));
  return "M "+x1+" "+y1+" C "+(x1+dx)+" "+y1+", "+(x2-dx)+" "+y2+", "+x2+" "+y2;
}

function zoomAt(v, deltaY, mx, my){
  const k2 = Math.min(CV.K_MAX, Math.max(CV.K_MIN, v.k * Math.exp(-deltaY * CV.ZOOM_SPEED)));
  return { k:k2, tx: mx - (mx - v.tx) * (k2 / v.k), ty: my - (my - v.ty) * (k2 / v.k) };
}
function fitView(W, H, vw, vh){
  const k = Math.min(CV.K_MAX, Math.min(vw/W, vh/H) * CV.FIT_MARGIN);
  return { k, tx:(vw - W*k)/2, ty:(vh - H*k)/2 };
}

    return '<rect x="'+(n.x*mk).toFixed(1)+'" y="'+(n.y*mk).toFixed(1)+'" width="'+(CV.NODE_W*mk).toFixed(1)+'" height="'+(CV.NODE_H*mk).toFixed(1)+'" rx="1.5" fill="'+col+'"></rect>';
  }).join("");
  const r = view.getBoundingClientRect ? view.getBoundingClientRect() : {width:0,height:0};
  const c = state.canvas;
  const vp = r.width ? '<rect x="'+((-c.tx/c.k)*mk).toFixed(1)+'" y="'+((-c.ty/c.k)*mk).toFixed(1)
    +'" width="'+((r.width/c.k)*mk).toFixed(1)+'" height="'+((r.height/c.k)*mk).toFixed(1)
    +'" fill="rgba(11,107,93,.07)" stroke="#0B6B5D" stroke-width="1.2"></rect>' : "";
  mini.innerHTML = dots + vp;
}
function canvasBind(){
  const view = document.getElementById("cvview");
  if(!view || !view.addEventListener) return;
  view.addEventListener("wheel", e=>{
    e.preventDefault();
    const r = view.getBoundingClientRect();
    Object.assign(state.canvas, zoomAt(state.canvas, e.deltaY, e.clientX - r.left, e.clientY - r.top));
    state.canvas.inited = true;
    canvasApply();
  }, {passive:false});
  let drag = null;
  view.addEventListener("pointerdown", e=>{
    if(e.target.closest && e.target.closest(".cvhud,.cvdrawer,.cvmini,.cvlegend,button,a")) return;
    drag = { x0:e.clientX, y0:e.clientY, tx0:state.canvas.tx, ty0:state.canvas.ty, moved:false, t:e.target };
    if(view.setPointerCapture && e.pointerId!=null){ try{ view.setPointerCapture(e.pointerId); }catch(_){} }
  });
  view.addEventListener("pointermove", e=>{
    if(!drag) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if(Math.abs(dx) > CV.CLICK_SLOP || Math.abs(dy) > CV.CLICK_SLOP) drag.moved = true;
    if(drag.moved){
      state.canvas.tx = drag.tx0 + dx; state.canvas.ty = drag.ty0 + dy;
      state.canvas.inited = true;
      view.classList.add("dragging");
      canvasApply();
    }
  });
  view.addEventListener("pointerup", e=>{
    view.classList.remove("dragging");
    if(!drag) return;
    const moved = drag.moved, t = drag.t; drag = null;
    if(moved) return;
    const nodeEl = (t && t.closest) ? t.closest(".cnode") : null;
    canvasSelect(nodeEl ? Number(nodeEl.dataset.q) : null);
  });
  view.addEventListener("pointercancel", ()=>{ drag = null; view.classList.remove("dragging"); });
  view.addEventListener("dblclick", e=>{
    const nodeEl = e.target.closest && e.target.closest(".cnode");
    if(nodeEl) canvasJump(Number(nodeEl.dataset.q));
  });
  view.addEventListener("mouseover", e=>{
    const nodeEl = e.target.closest && e.target.closest(".cnode");
    if(nodeEl) edgeHl(nodeEl.dataset.q, true);
  });
  view.addEventListener("mouseout", e=>{
    const nodeEl = e.target.closest && e.target.closest(".cnode");
    if(nodeEl) edgeHl(nodeEl.dataset.q, false);
  });
  const mini = document.getElementById("cvmini");
  if(mini && mini.addEventListener){
    const jumpTo = e=>{
      const mr = mini.getBoundingClientRect(); if(!mr.width || !CVL) return;
      const mk = Math.min(CV.MINI_W/CVL.W, CV.MINI_H/CVL.H);
      const sx = (e.clientX - mr.left) * (CV.MINI_W / mr.width);
      const sy = (e.clientY - mr.top)  * (CV.MINI_H / mr.height);
      const vr = view.getBoundingClientRect();
      state.canvas.tx = vr.width/2  - (sx/mk) * state.canvas.k;
      state.canvas.ty = vr.height/2 - (sy/mk) * state.canvas.k;
      state.canvas.inited = true;
      canvasApply();
    };
    let md = false;
    mini.addEventListener("pointerdown", e=>{ md = true; jumpTo(e); e.stopPropagation(); });
    mini.addEventListener("pointermove", e=>{ if(md) jumpTo(e); });
    mini.addEventListener("pointerup",   ()=>{ md = false; });
    mini.addEventListener("pointerleave",()=>{ md = false; });
  }
}

function fsHTML(list, prefix){

function previewHTML(p){

  const jump = f.panel
    ? `<button class="btn ghost" onclick="jumpPanel('${f.panel}',${f.arg!=null?f.arg:"null"})">→ 相关面板:${esc(f.panelLabel||f.panel)}</button>` : "";

const MAX_STREAM = 400, FOLLOW_SLOP = 40;
const FILTER_GROUPS = { all:null, advance:["advance"], gate:["gate"], notify:["notify"],
                        runner:["runner","heartbeat"], directive:["directive"], cmd:["cmd","reply"] };
const FILTER_LABELS = { all:"全部", advance:"推进", gate:"门禁", notify:"通知", runner:"runner", directive:"指令", cmd:"命令" };
function streamAtBottom(el){ return (el.scrollHeight - el.scrollTop - el.clientHeight) < FOLLOW_SLOP; }
function hiddenAttr(k){
  const g = FILTER_GROUPS[state.stream.filter];
  return (g && !g.includes(k)) ? "hidden" : "";
}
function streamLineHTML(e){
  const allowed=new Set(["advance","gate","notify","runner","heartbeat","directive","cmd","reply"]);
  const kind=allowed.has(e.k)?e.k:"notify";
  return `<div class="sline k-${kind}" data-k="${kind}" ${hiddenAttr(kind)}><span class="st">${esc(e.t||"")}</span><span class="sk">${esc(kind)}</span><span class="sx">${e.html || esc(e.text||"")}</span></div>`;
}
function buildStreamHistory(){
  const out = [];
  DB.cycle.forEach(c=>{
    out.push({ t:c.started_at, k:"advance", text:"cycle "+c.id+" start · route="+(c.route||"worker")+(c.active_question_id?" · Q"+c.active_question_id:"") });
    DB.decision.filter(d=>d.cycle_id===c.id).forEach(d=>{
      out.push({ t:c.started_at, k:(d.actor==="gate"||d.actor==="judge")?"gate":"advance",
                 text:"#"+d.id+" "+d.actor+" "+d.type+" — "+String(d.summary||"").slice(0,72) });   // 真数据 summary 可空
    });
    if(c.status!=="bundle"){ const note=c.note||"";                                                  // 真数据 note 可空
      out.push({ t:c.started_at, k:"advance", text:"cycle "+c.id+" → "+c.status+"("+note.slice(0,56)+(note.length>56?"…":"")+")" }); }
  });
  DB.notification.forEach(n=>{
    out.push({ t:n.at, k:String(n.event||"").indexOf("directive")===0?"directive":"notify", text:"["+(n.event||"")+"] "+(n.text||"") });
  });
  // （原型此处焊了 9 行假 runner/heartbeat telemetry 作演示——真数据接入已删；事件流仅由真 cycle/decision/notification 铺成）
  out.sort((a,b)=> a.t<b.t ? -1 : a.t>b.t ? 1 : 0);
  return out;
}

/* ---------------- 落盘树 / 文件预览 ---------------- */
function fsRefresh(){
  const el = document.getElementById("fstree"); if(!el) return;
  const st = el.scrollTop;
  const tree = (typeof DB!=="undefined" && DB.fs) ? DB.fs : FS;   // 真模式用 server 真文件树(DB.fs)，未连线 demo 回退 mock FS
  const note = (typeof DB!=="undefined" && DB.fs) ? "work/ 运行产物 + schemas/prompts/policies/input 只读镜像;点击文件经 /api/file 拉真内容(白名单)。"
                                                  : "db/ = 唯一真相(SQLite);views/ 与卡片可重建;大文件只引用不复制(path+hash)。点击文件看模拟内容。";
  el.innerHTML = `<div class="fstitle">落盘镜像(只读)</div>` + fsHTML(tree, "") + `<div class="fsnote">${note}</div>`;
  // 文件名来自 work/uploads 等不可信输入面：只放经过 HTML 转义的 data 属性，再由事件委托读取；
  // 禁止把 path 拼进 inline onclick（引号文件名会形成 stored XSS）。赋值 onclick 避免 refresh 累积监听器。
  el.onclick = ev=>{
    const row=ev.target&&ev.target.closest?ev.target.closest("[data-fs-action]"):null;
    if(!row) return;
    const p=row.getAttribute("data-fs-path"), action=row.getAttribute("data-fs-action");
    if(action==="toggle") fsToggle(p); else if(action==="open") fsOpen(p);
  };
  el.scrollTop = st;
}
function fsToggle(p){
  state.fs.expand.has(p) ? state.fs.expand.delete(p) : state.fs.expand.add(p);
  fsRefresh();
}
function fsOpen(p){ state.fs.sel = p; fsRefresh(); openPreview(p); }
function openPreview(p){ state.preview = p; document.getElementById("preview").innerHTML = previewHTML(p); }
function closePreview(){

  const el = document.getElementById("preview"); if(el) el.innerHTML = "";
}
function jumpPanel(panel, arg){ closePreview(); go(panel, arg==null?undefined:arg); }

/* ---------------- 输出记录窗口(dock) ---------------- */
function dockToggle(){
  state.dockFolded = !state.dockFolded;
  const d = document.getElementById("dock");
  if(d && d.classList) d.classList.toggle("folded", state.dockFolded);
  const b = document.getElementById("dockfoldbtn");
  if(b) b.textContent = state.dockFolded ? "展开 ▴" : "收起 ▾";
}
function renderFilterChips(){
  const el = document.getElementById("sfilter"); if(!el) return;
  el.innerHTML = Object.keys(FILTER_GROUPS).map(g=>
    `<button class="fchip ${state.stream.filter===g?"on":""}" onclick="setStreamFilter('${g}')">${FILTER_LABELS[g]}</button>`).join("");
}
function setStreamFilter(g){
  state.stream.filter = g;
  renderFilterChips();
  const el = document.getElementById("stream"); if(!el || !el.children) return;
  const grp = FILTER_GROUPS[g];
  for(const c of Array.from(el.children)){
    const k = c.dataset ? c.dataset.k : null;
    if(k==null) continue;
    c.hidden = !!(grp && grp.indexOf(k)===-1);
  }
  if(streamAtBottom(el)) el.scrollTop = el.scrollHeight;
}
function nowStr(){
  const s = state.stream;
  if(LIVE_MODE){
    const d=new Date(), pad=n=>String(n).padStart(2,"0");
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
  }
  return "demo " + String(s.hh).padStart(2,"0") + ":" + String(s.mm).padStart(2,"0");
}
function appendStream(e){
  const el = document.getElementById("stream"); if(!el) return;
  const stick = streamAtBottom(el);
  state.stream.seq++;
  if(!e.t) e.t = nowStr();
  el.insertAdjacentHTML("beforeend", streamLineHTML(e));
  while(el.children && el.children.length > MAX_STREAM && el.firstElementChild) el.removeChild(el.firstElementChild);
  if(stick) el.scrollTop = el.scrollHeight;
}
/* 统一事件汇合点:落输出流一行;带 narr 则讲解员自动插解说 */
function emitEvent(e){
  appendStream(e);
  if(e.narr) appendNarrator({ role:"narr", html:e.narr });
}
function streamSeed(){
  buildStreamHistory().forEach(appendStream);
  const el = document.getElementById("stream");
  if(el) el.scrollTop = el.scrollHeight;
}
function streamSetScenario(){
  if(state.stream.timer){ clearInterval(state.stream.timer); state.stream.timer = null; }
  if(HEADLESS || LIVE_MODE || state.scenario!=="running") return;   // 真数据模式不跑 mock 假 ticker（改 streamSyncReal 增量真事件）
  state.stream.timer = setInterval(streamTick, 5000);
}
let tickFlip = false;
function streamTick(){
  const s = state.stream;
  s.mm += 1; if(s.mm>=60){ s.mm=0; s.hh=(s.hh+1)%24; }
  tickFlip = !tickFlip;
  if(tickFlip){
    emitEvent({ k:"heartbeat", text:"[watchdog] transcript mtime "+(2+Math.floor(Math.random()*7))+"s ago · pid alive · gpu util 9"+Math.floor(Math.random()*8)+"%" });
  } else {
    s.step += 40;
    s.loss = Math.max(2.2, s.loss - 0.002 - Math.random()*0.004);
    emitEvent({ k:"runner", text:"step "+String(s.step).padStart(5,"0")+"/24000  loss "+s.loss.toFixed(4)+"  lr 8.1e-4  tok/s 51."+Math.floor(Math.random()*9)+"k" });
  }
}

  if(!t) return;
  if(inp) inp.value = "";

  const x = classify(t); x.id = ++extraSeq; x.raw = t;
  state.chatExtra.push(x);
  emitEvent({ k:"cmd", text:"ACK 0.8s ✓ 已入账 interaction_message(ik-"+(1000+x.id)+")· 分类 → "+x.intent });
  if(x.intent==="query"){
    emitEvent({ k:"reply", html:(x.template?chip("c-line","模板"):chip("c-acc","codex 中介"))+" "+esc(x.reply)+' <span class="hash">snapshot_cycle=18 · grounding ✓</span>' });
  } else if(x.intent==="note"){
    emitEvent({ k:"notify", text:"note 入队:"+(x.note||t),
      narr:"你的 note 已入队,下一轮 reasoning 开头消费;消费时会写 directive_note DECISION，并进入该轮 ContextPack。" });
  } else if(x.intent==="unclear"){
    emitEvent({ k:"reply", html:chip("c-warn","unclear")+" "+esc(x.reply||"") ,
      narr:"这条消息分类置信度低,被登记为待确认(directive_pending):系统不自动答、也不自动改状态。想细聊可以在我这儿说清意图,我帮你草拟。" });
  } else if(x.intent==="directive"){
    if(x.dstate==="ask"){
      emitEvent({ k:"directive",
        html: chip("c-human", x.dlabel) + " " + chip("c-warn","pending_confirmation")

/* 关键词模拟分类器(真实实现 =《第二部分》§6.8 classifier;此处仅演示三分类行为) */
function classify(t){
  const num = (t.match(/(\d+(?:\.\d+)?)/)||[])[1];
  if(/继续|接着跑|接着来/.test(t))
    return { intent:"query", template:true,
      note:"continue 特例:系统在跑 → 仅 ACK,不产 directive(§4.6.2)",
      reply:"已在继续,当前快照 cycle 18,正在执行 cycle 19(bundle target 3/5,v-gate-headmix 训练中)。未产生任何状态变更指令。" };
  if(/该不该|要不要|是不是该|帮我看看/.test(t))
    return { intent:"unclear", template:true,
      note:"低置信 → directive_pending:回显确认、不自动答、不自动改状态",
      reply:"您的消息可能涉及状态变更,已登记待确认:请说明是想「查询现状」还是「下达指令」,并给出具体内容。确认前不会改变任何状态。" };
  if(/预算|上限|B_max/i.test(t))
    return { intent:"directive", dlabel:"d(new) set_budget", dstate:"ask",
      polish:"将单轮预算封顶 B_max 由 $40 调整为 $"+(num||"50")+"(B0 / 翻倍周期不变)。",
      note:"硬指令:先建 directive(status=pending, confirmed:false),回显润色稿等待确认" };
  if(/暂停|停下|先停|停止|停机/.test(t))
    return { intent:"directive", dlabel:"d(new) pause", dstate:"ask",
      polish:"暂停研究循环:当前阶段收尾后不再开新轮,直至 resume。",
      note:"硬指令回显确认;consume_at=immediate / 阶段边界" };
  if(/已提供|已上传|放好了|r\d+ ?已/.test(t))
    return { intent:"note", dlabel:"request_provide", dstate:"confirmed",
      polish:"文件请求答复:uploads/ 已放好,请校验。",
      note:"答复只按 note 入账，不会自动 resolve；真实控制面须在「指令与请求」面板点击解决，由 daemon 校验并接纳" };
  if(/优先|插入|插一个|加一个问题|安排.*验证|先验证/.test(t))
    return { intent:"directive", dlabel:"d(new) inject_question", dstate:"confirmed",
      polish:"插入问题:"+t+"(置高优先级,directive_adjust 加成)。",
      note:"软指令入队,下一轮 reasoning 开头消费;系统可有理由地不从(理由入 DECISION)" };
  if(/注意|留意|觉得|担心|可能.*敏感|提醒/.test(t))
    return { intent:"note",
      note:"note(软注解)→ 下一轮 reasoning 开头消费;不写 decision、不改状态" };
  if(/进展|怎么样|状态|在跑|现在|多少|剩|情况|什么|[??]/.test(t)){
    const scen = SCENARIOS[state.scenario];
    return { intent:"query", template:false,
      reply:"上次完成快照 cycle 18:goal v2;Q7 已回答(GLA 16k 退化 3.8% 达标);选题 Q13 intent=attack;open/inconclusive 3/0;预算 B(t) $40、全局剩余 $514.4。当前正在执行:"
        +(state.scenario==="idle" ? "无(轮间空闲,等待下次唤醒)。"
          : "cycle 19 bundle,target "+scen.cursor+","+(state.scenario==="awaiting_user"?"文件请求 r2 pending,全局等待用户供给(问答/通知照常)。":"v-gate-headmix 训练中,心跳 "+scen.heartbeat_age+"。")) };
  }
  return { intent:"unclear", template:true,
    note:"低置信 → directive_pending:回显确认",
    reply:"未能确定意图(保守三分类)。请说明是「查询现状」还是「下达指令」;可能改状态的请求都需要回显确认。" };

/* ==================== 步⑨ CP9.2 · 真数据接入（console_server /api）====================
   原型渲染码保真不动，仅把数据源从 mock DB 换成 /api/db。server 形状（payload.tables.<表> + 派生平铺）
   经 adaptPayload() 映射回原型 DB 形状（顶层 DB.<表> + status_card/notification/policy/live/派生列），
   render() 照原样渲染。命令行→POST /api/message；文件预览→GET /api/file。HEADLESS(node 冒烟)下不 fetch。 */
function _summ(pj){ try{ const o=JSON.parse(pj); return o.reason||o.type||o.verdict||o.review_kind||JSON.stringify(o).slice(0,90);}catch(e){ return String(pj||"").slice(0,90);} }
function emptyPage(title,sub){ return `<div class="pagehead"><h1>${esc(title)}</h1></div><p class="pagesub">${esc(sub)}</p>`; }  // 空表占位（稀疏/新建真库不崩）
function _fsConv(nodes){ return (nodes||[]).map(n=> n.dir ? {p:n.p, d:_fsConv(n.children||[])} : {p:n.p}); }  // server fs {p,dir,children} → 渲染器 {p,d}
function _finiteNumber(value, fallback){ return typeof value==="number"&&Number.isFinite(value)?value:fallback; }
function adaptPayload(p){
  const T=(p&&p.tables)||{}, D={};
  for(const k in T) D[k]=T[k];                                   // 真表平铺到顶层（原型访问 DB.<表>）
  D.notification=((p&&p.notification)||[]).map(n=>{
    // 真 Outbox 形状={event_key,kind,payload}；旧原型形状={at,channel,event,text}。统一后通知面不再空白。
    if(n&&n.kind){
      const ds=Array.isArray(n.deliveries)?n.deliveries:[], last=ds.length?ds[ds.length-1]:null;
      const delivery=last?(last.status==="delivered"?` [${last.channel||"connector"} 已投递]`:
        last.status==="suppressed"?` [${last.channel||"connector"} 已安全抑制：无可信路由]`:
        last.status==="authority_corrupt"?` [投递权威损坏: ${last.last_error_kind||"unknown"}]`:
        ` [${last.channel||"connector"} 重试中: ${last.last_error_kind||"unknown"}]`):"";
      return {event_key:n.event_key, at:n.at||"—", channel:n.channel||(last&&last.channel)||"outbox",
        event:n.kind, text:(n.text||JSON.stringify(n.payload||{}))+delivery};
    }
    return n||{};
  });
  D.ledger_by_cycle=((p&&p.ledger_by_cycle)||[]).map(l=>{
    const raw=String(l&&l.cycle), match=/^c?(0|[1-9]\d*)$/.exec(raw), n=match?Number(match[1]):null;
    return {cycle:(Number.isSafeInteger(n)?n:null), money:_finiteNumber(l&&l.money,0)};
  }).filter(l=>l.cycle!=null);                                  // server 发 "c1"；非法 cycle/type 不进入 inline 图表属性
  D.policy=(p&&p.policy)||{}; D.live=(p&&p.live)||{}; D.runner_call_live=(D.live&&D.live.runner_call)||null;
  // status_card：真 builder 是**嵌套**（goal/selection/counts/budget）；原型渲染读**扁平**键 → 拍平改名。
  const sc=(p&&p.status_card)||{}, scb=sc.budget||{};
  const aqid=sc.active_question&&(sc.active_question.id!=null?sc.active_question.id:sc.active_question);
  D.status_card={
    snapshot_cycle: sc.snapshot_cycle,
    goal_ver: (sc.goal&&sc.goal.ver!=null)?sc.goal.ver:(sc.goal_ver!=null?sc.goal_ver:""),
    goal_summary: (sc.goal&&sc.goal.summary)||sc.goal_summary||"",
    active_question: aqid!=null?String(aqid).replace(/^[a-z]/i,""):"—",
    cycle_status: sc.cycle_status||"", cycle_route: sc.route||sc.cycle_route||"",
    selection_intent: (sc.selection&&sc.selection.intent)||sc.selection_intent||"—",
    selection_decision: (sc.selection&&sc.selection.latest_decision&&("decision #"+sc.selection.latest_decision.id))||sc.selection_decision||"",
    open_count: _finiteNumber((sc.counts&&sc.counts.open!=null)?sc.counts.open:sc.open_count,0),
    inconclusive_count: _finiteNumber((sc.counts&&sc.counts.inconclusive!=null)?sc.counts.inconclusive:sc.inconclusive_count,0),
    heartbeat_ref: sc.heartbeat_ref||null, pending_request: sc.pending_file_request||sc.pending_request||null,
  };
  // budget（每拍 topbar 必读）：从 status_card.budget + policy.session_max + ledger 求和合成（真成本网休眠→0）。
  const _gspent=(D.ledger_by_cycle||[]).reduce((s,l)=>s+((l&&l.money)||0),0);
  const _sm=(p&&p.policy&&p.policy.budget)?p.policy.budget.session_max:null;
  const _gtotal=(_sm==null)?null:_finiteNumber(_sm,null);        // session_max=null/非法 ⇒ 观测面关闭，不把字符串带进 HTML/算术
  D.budget={ B_t:_finiteNumber(scb.B_t,0), cycle_spent:_finiteNumber(scb.cycle_spent,0),
    global_total: _gtotal, global_spent: _gspent,
    // 全局余优先用 server 真值 status_card.budget.global_remaining（口径权威）；缺失才由 total-spent 兜底
    global_remaining: (scb.global_remaining!=null)?_finiteNumber(scb.global_remaining,null):(_gtotal!=null?_gtotal-_gspent:null) };
  D.fs = (p&&p.fs&&p.fs.roots) ? _fsConv(p.fs.roots) : null;     // 真文件树（server _fs_tree）→ 渲染器形状；缺失=demo 用 mock FS
  (D.decision||[]).forEach(d=>{ if(d.summary==null) d.summary=_summ(d.payload_json); });   // 派生列映射
  // directive.payload_json 是 JSON 串（携 polished/confirmed）；渲染码读 d.payload.polished/.confirmed → 解析成对象
  (D.directive||[]).forEach(d=>{ if(d.payload==null){ try{ d.payload=JSON.parse(d.payload_json||"{}")||{}; }catch(e){ d.payload={polished:String(d.payload_json||"")}; } } });
  (D.interaction_request||[]).forEach(r=>{
    if(r.items==null){ try{ r.items=JSON.parse(r.items_json||"[]")||[]; }catch(e){ r.items=[]; } }
    if(r.resolution==null && r.resolution_json){ try{ r.resolution=JSON.parse(r.resolution_json); }catch(e){ r.resolution={invalid_json:true}; } }
  });
  const tg={}; (T.baseline_tag||[]).forEach(t=>{(tg[t.baseline_id]=tg[t.baseline_id]||[]).push(t.tag);});
  (D.baseline||[]).forEach(b=>{ if(b.tags==null) b.tags=tg[b.id]||[]; });
  (D.execution_log||[]).forEach(l=>{ if(l.owner==null) l.owner=(l.run_id!=null)?('run '+l.run_id):(l.evaluation_attempt_id!=null?('attempt '+l.evaluation_attempt_id):''); });
  return D;
}
// ---- live 真数据模型：原型用 mock SCENARIOS[state.scenario] 供「心跳/游标/成本/运行中」，此处用真 payload.live 覆盖 ----
let LIVE_MODE=false;                                              // 接入真数据后置真 → 渲染码隐藏 mock 演示件（场景切换器 / 「模拟」按钮）
function buildLive(p){                                            // payload.live + status_card → 原型 scen 形状；真值优先，未知诚实置「—」（不编造）
  const lv=(p&&p.live)||{}, bud=((p&&p.status_card&&p.status_card.budget)||{}), rc=lv.runner_call;
  const allowedModes=new Set(["running","awaiting_user","paused","idle"]), mode=allowedModes.has(lv.mode)?lv.mode:"idle";
  const LBL={running:"训练执行中",awaiting_user:"等待用户供给",paused:"人工暂停",idle:"轮间空闲"};
  return { mode, label:LBL[mode], idle:mode==="idle", request:mode==="awaiting_user",
    paused:mode==="paused", approval:false,
    heartbeat_age:(typeof lv.heartbeat_age_s==="number"&&Number.isFinite(lv.heartbeat_age_s))?(lv.heartbeat_age_s+" 秒前"):"—",
    runner: rc?("runner_call #"+rc.id+" · "+(rc.phase||"")+" · "+(rc.status||"")):"（无活跃 runner）",
    cursor:"—", cursor_pct:0, watchdog:"—", watchdog_pct:0,      // bundle 游标 / watchdog 不在 live 载荷 → 诚实置空
    cost:"$"+_finiteNumber(bud.cycle_spent,0) };
}
function applyLive(p){                                            // 覆盖 SCENARIOS[真 mode] + 指向它 → 10+ 处读 SCENARIOS[state.scenario] 的渲染码零改即得真值
  const L=buildLive(p); SCENARIOS[L.mode]=L; state.scenario=L.mode; LIVE_MODE=true; return L;
}
function clampSelections(){                                       // mock 默认选中 id（selB:4/selCycle:19/selA:6/selQ:13）在稀疏真数据里可能不存在 → 夹到真实存在的 id，避免 find 落空崩渲染
  if(!bl(state.selB))     state.selB=(DB.baseline&&DB.baseline[0])?DB.baseline[0].id:null;
  if(!cy(state.selCycle)) state.selCycle=(DB.cycle&&DB.cycle.length)?DB.cycle.reduce((m,c)=>c.id>m?c.id:m,DB.cycle[0].id):null;   // 最新=max id（不依赖行序）
  if(!an(state.selA))     state.selA=(DB.answer&&DB.answer[0])?DB.answer[0].id:null;
  if(!q(state.selQ))      state.selQ=(DB.question&&DB.question[0])?DB.question[0].id:null;
}
function streamSyncReal(){                                        // 真事件流：每拍重算 cycle/decision/notification 全量历史，按稳定键只追加**未见过**的
  if(!state.stream.seen) state.stream.seen=new Set();             // → 新轮/新决策/新通知都进流；乱序/outbox 坏行重排也不重复不漏（不再靠 notification 数组长度）
  if(!state.stream.realSeeded){                                  // 首个真刷新：清 mock 种子的流
    const el=(typeof document!=="undefined")&&document.getElementById("stream"); if(el) el.innerHTML="";
    state.stream.seen.clear(); state.stream.realSeeded=true;
  }
  buildStreamHistory().forEach(ev=>{ const key=ev.t+"|"+ev.k+"|"+ev.text;
    if(!state.stream.seen.has(key)){ state.stream.seen.add(key); appendStream(ev); } });
}
let _dbInFlight=false;                                           // 本拍已有 /api/db 在途 → 跳过，不在 3s 轮询下堆并发（慢响应也只有一个在飞）
async function refreshDB(){
  if(HEADLESS || typeof fetch==="undefined" || _dbInFlight) return;
  _dbInFlight=true;
  try{ const r=await apiFetch('/api/db'); if(!r.ok){ showConnectionGuard("真实状态接口返回 HTTP "+r.status+"。"); return; } const p=await r.json();
    DB=adaptPayload(p); applyLive(p); clampSelections();
    if(state.stream.timer){ clearInterval(state.stream.timer); state.stream.timer=null; }  // 停 mock 假 ticker
    streamSyncReal(); render(); markConsoleSnapshotFresh();
  }catch(e){ showConnectionGuard("无法连接真实控制台 API："+(e&&e.message?e.message:String(e))); }
  finally{ _dbInFlight=false; }
}
if(typeof window!=="undefined" && !HEADLESS && !DEMO_MODE){
  fsOpen=function(p){ state.fs.sel=p; fsRefresh();
    if(!LIVE_MODE){ openPreview(p); return; }                    // 未连线 demo：仍走 mock FILE_CONTENT（否则点文件全报白名单不可读）
    apiFetch('/api/file?p='+encodeURIComponent(p)).then(r=>r.ok?r.text():Promise.reject()).then(txt=>{  // 真模式换真拉取（白名单 /api/file）
      FILE_CONTENT[p]={body:txt, note:"由 /api/file 拉取（只读镜像）"}; openPreview(p);
    }).catch(()=>{ FILE_CONTENT[p]={body:"(该文件不在白名单或不可读)"}; openPreview(p); });
  };
  sendCmd=function(textArg){                                      // 命令行换真入站（写 spool，run 进程 ingest）
    const inp=document.getElementById("cmdin");
    const t=(textArg!=null?textArg:(inp&&inp.value||"")).trim(); if(!t) return;
    if(!_consoleReady){ showConnectionGuard("控制台连接已失效，拒绝发送命令。"); return; }
    if(inp) inp.value="";
    emitEvent({k:"cmd", html:"<b>&gt; "+esc(t)+"</b>"});
    apiPost('/api/message',{text:t,conversation_id:_conversationId()})
      .then(({response,body:j})=>{ const ok=response.ok; if(!ok || !j || !j.queued){ emitEvent({k:"cmd", text:"入队失败:"+((j&&j.error)||"服务器拒绝")}); return; }
        emitEvent({k:"cmd", text:"已入队 console_inbox（seq "+j.queued.seq+"）· 待 run 进程 ingest→分类"}); })
      .catch(e=>emitEvent({k:"cmd", text:"入队失败:"+e}));
  };
}

renderShell();
render();
streamSetScenario();
if(typeof window!=="undefined" && !HEADLESS && !DEMO_MODE){
  showConnectionGuard(_consoleCapability?"正在连接真实控制台…":"需要 capability 才能连接真实控制台。");
  refreshDB(); setInterval(refreshDB, 3000); setInterval(enforceSnapshotFreshness,1000);
}   // 首拉 + 3s 轮询真数据；mock 只在显式 ?demo=1 下启用
